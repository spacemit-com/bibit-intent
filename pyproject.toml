[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bibit-intent"
version = "0.1.0"
description = "Edge-first intent router for Bianbu devices"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "anyio>=4.0",
  "httpx>=0.24",
  "mcp>=1.19",
  "openai>=1",
  "pydantic>=2",
  "pydantic-settings>=2",
  "jieba==0.42.1",
  "psutil>=7",
  "PyYAML>=6.0",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
tn = ["WeTextProcessing>=1.2.0", "importlib_resources>=6.0"]

[project.scripts]
bibit-intent = "bibit_intent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.25",
]


[tool.hatch.build.targets.wheel]
packages = ["src/bibit_intent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
