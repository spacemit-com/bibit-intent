# 统一工具声明
# 一份声明，三段各自读取对应视图（规则模板/端侧签名/完整 MCP schema）
# 对照 design.md §6

tools:

  get_vol_status:
    display: "查询音量"
    display_en: "Read the current system master output volume level (0-100). Use when the user asks what the current volume is, how loud the sound currently is, or wants to check the volume without changing it. For changing the volume use set_volume or adjust_volume."
    short: "vol_status"
    aliases: ["当前音量", "现在音量", "查看音量"]
    params: {}
    routes:
      rule:
        patterns:
          - "^(?:现在|当前|目前)?(?:的)?(?:系统)?(?:主)?(?:音量|声音)(?:是)?(?:多少|多大|百分之几|什么情况|怎么样了|有多高)?$"
          - "^(?:音量|声音)(?:现在|当前|目前)?(?:是|有)?(?:多少|多大|百分之几|什么情况|怎么样了|有多高|多少了)$"
          - "^(?:查看|查|看|看看)(?:一下|下)?(?:当前|现在|目前)?(?:系统)?(?:主)?(?:音量|声音)$"
          - "^(?:what(?:'s| is)|whats)\\s+(?:the\\s+)?(?:current\\s+)?(?:system\\s+)?(?:master\\s+)?(?:volume|sound)(?:\\s+level)?\\??$"
          - "^(?:show|view|check|display|get)\\s+(?:the\\s+)?(?:current\\s+)?(?:system\\s+)?(?:master\\s+)?(?:volume|sound)(?:\\s+level)?\\??$"
          - "^(?:current\\s+)?(?:volume|sound)(?:\\s+level)?\\??$"
        keywords: ["当前音量", "现在音量", "音量是多少", "音量多大", "声音是多少", "声音多大"]
      local: "vol_status()"
    system:
      type: proc
      mcp:
        group: readonly

  set_volume:
    display: "设置音量"
    display_en: "Set the system master output volume to an absolute level (0-100). Use only when the user gives a target volume/sound level, e.g. '音量调到22' / 'set volume to 30'. For increasing or decreasing volume without a target value use adjust_volume. For microphone/recording volume use audio_input_volume; for mute/unmute toggle use mute; for switching output device use audio_output_switch."
    short: "vol"
    aliases: ["volume", "sound", "audio", "loudness", "volume level", "声音", "音量"]
    params:
      level: {type: int, range: [0, 100], unit: "%"}
    routes:
      rule:
        patterns:
          - "^(?:set|turn)\\s+(?:the\\s+)?volume\\s+(?:to\\s+)?(?P<level>\\d{1,3})(?:%| percent)?$"
          - "^(?:please\\s+)?(?:set|put|adjust|change)\\s+(?:the\\s+)?(?:volume|sound|audio|loudness)(?:\\s+level)?\\s*(?:to|at|on)?\\s*(?P<level>\\d{1,3})%?(?:\\s*percent)?$"
          - "^(?!.*(?:麦克风|话筒|录音|输入))(音量|声音).{0,6}(调|设|改)\\D{0,4}(?P<level>\\d+(?!成))"
          # 中文数字档位："调到六成/百分之六十/一半"（cn_number 解析）
          - "^(?!.*(?:麦克风|话筒|录音|输入))(音量|声音).{0,6}(调|设|改)\\D{0,4}(?P<level>百分之[零一二两三四五六七八九十百]+|[零一二两三四五六七八九]成|\\d+成|半)"
          - "^(?!.*(?:麦克风|话筒|录音|输入))(?:把|将)\\s*(?:音量|声音)\\s*(?:调|设|改)(?:到|为|成)?\\s*(?P<level>百分之[零一二两三四五六七八九十百]+|[零一二两三四五六七八九]成|\\d+成|半|\\d{1,3})$"
          - "^(?!.*(?:麦克风|话筒|录音|输入))(调|设)\\D{0,4}(音量|声音)\\D{0,4}(?P<level>\\d+(?!成))"
          - "^(?!.*(?:麦克风|话筒|录音|输入))(调|设)\\D{0,4}(音量|声音)\\D{0,4}(?P<level>百分之[零一二两三四五六七八九十百]+|[零一二两三四五六七八九]成|\\d+成|半)"
          - "^(?!.*(?:麦克风|话筒|录音|输入))(?P<level>\\d+(?!成)).{0,4}(音量|声音)"
          - "^(?!.*(?:麦克风|话筒|录音|输入))(?P<level>百分之[零一二两三四五六七八九十百]+|[零一二两三四五六七八九]成|\\d+成|半).{0,4}(音量|声音)"
        keywords: ["音量", "声音", "volume", "sound", "audio"]
        slot_map:
          拉满: {level: 100}
          开到最大: {level: 100}
          最大: {level: 100}
          百分百: {level: 100}
          百分之百: {level: 100}
          没声音: {level: 80}
          最小: {level: 0}
          最低: {level: 0}
      local: "vol(level:0-100)"
    system:
      type: alsa
      cmd: "amixer sset Master {level}%"

  adjust_volume:
    display: "调节音量"
    display_en: "Adjust the system master output volume relative to its current level. Use when the user asks to turn the volume up/down, louder/quieter, or adjust by a step without a target level. Pass direction (up/down) and optional amount (default 10). For a specific target level use set_volume."
    short: "vol_adj"
    aliases: ["adjust volume", "volume up", "volume down", "turn up", "turn down", "louder", "quieter", "调大音量", "调小音量", "音量调大", "音量调小"]
    params:
      direction: {type: str, enum: [up, down]}
      amount: {type: int, default: 10, range: [1, 100], unit: "%"}
    routes:
      rule:
        patterns:
          - "^(?:turn|make)\\s+(?:the\\s+)?(?:volume|sound|audio|it)\\s+(?:up|higher|louder|down|lower|quieter)$"
          - "^(?:调高|调大|提高|增大|开大)(?:一下|一点)?(?:音量|声音)$"
          - "^(?:调低|调小|降低|减小|关小)(?:一下|一点)?(?:音量|声音)$"
          - "^(?:音量|声音)(?:调高|调大|调低|调小|大一点|小一点)(?:一下|一点)?$"
          - "^(?:把|将)\\s*(?:音量|声音)\\s*(?:调高|调大|调低|调小|开大|关小|大一点|小一点)(?:一下|一点)?$"
        keywords: ["调高音量", "调大音量", "提高音量", "增大音量", "调低音量", "调小音量", "降低音量", "减小音量", "音量调高", "音量调小", "turn up", "turn down", "louder", "quieter", "volume up", "volume down"]
        slot_map:
          开大: {direction: up, amount: 10}
          调高: {direction: up, amount: 10}
          调大: {direction: up, amount: 10}
          大一点: {direction: up, amount: 10}
          提高: {direction: up, amount: 10}
          增大: {direction: up, amount: 10}
          调低: {direction: down, amount: 10}
          调小: {direction: down, amount: 10}
          小一点: {direction: down, amount: 10}
          降低: {direction: down, amount: 10}
          减小: {direction: down, amount: 10}
      local: "vol_adj(direction:up|down,amount:1-100)"
    system:
      type: alsa
      cmd: "amixer sset Master {level}%"

  get_display_light:
    display: "查询亮度"
    display_en: "Read the current screen/backlight brightness level (0-100). Use when the user asks what the current brightness is, how bright the screen currently is, or wants to check brightness without changing it. For changing brightness use set_brightness or adjust_brightness."
    short: "display_light_status"
    aliases: ["当前亮度", "现在亮度", "查看亮度"]
    params: {}
    routes:
      rule:
        patterns:
          - "^(?:现在|当前|目前)?(?:的)?(?:屏幕|显示器|系统)?(?:背光|亮度)(?:是)?(?:多少|多大|百分之几|什么情况|怎么样了|有多高)?$"
          - "^(?:亮度|背光|屏幕亮度)(?:现在|当前|目前)?(?:是|有)?(?:多少|多大|百分之几|什么情况|怎么样了|有多高|多少了)$"
          - "^(?:查看|查|看|看看)(?:一下|下)?(?:当前|现在|目前)?(?:屏幕|显示器)?(?:亮度|背光)$"
          - "^(?:what(?:'s| is)|whats)\\s+(?:the\\s+)?(?:current\\s+)?(?:screen\\s+)?(?:brightness|backlight)(?:\\s+level)?\\??$"
          - "^(?:show|view|check|display|get)\\s+(?:the\\s+)?(?:current\\s+)?(?:screen\\s+)?(?:brightness|backlight)(?:\\s+level)?\\??$"
        keywords: ["当前亮度", "现在亮度", "亮度是多少", "亮度多大", "背光是多少", "背光多大"]
      local: "display_light_status()"
    system:
      type: sysfs
      path: "/sys/class/backlight/*/brightness"
      mcp:
        group: readonly

  set_brightness:
    display: "设置屏幕亮度"
    display_en: "Set the screen brightness to an absolute level (0-100). Use only when the user gives a target brightness/backlight level. For increasing or decreasing brightness without a target value use adjust_brightness. If the user gives only a target value without naming brightness/backlight, ask which setting they mean. For resolution use set_resolution; for UI scaling/zoom use set_aspect_ratio; for refresh rate use set_refresh_rate; for rotation use rotate_screen."
    short: "bright"
    aliases: ["brightness", "screen brightness", "backlight", "display brightness", "亮度", "屏幕亮度"]
    params:
      level: {type: int, range: [0, 100], unit: "%"}
    routes:
      rule:
        patterns:
          - "^(?:set|turn)\\s+(?:the\\s+)?brightness\\s+(?:to\\s+)?(?P<level>\\d{1,3})(?:%| percent)?$"
          - "^(?:please\\s+)?(?:set|put|adjust|change)\\s+(?:the\\s+)?(?:brightness|screen brightness|backlight)(?:\\s+level)?\\s*(?:to|at|on)?\\s*(?P<level>\\d{1,3})%?(?:\\s*percent)?$"
          - "(亮度|屏幕亮).{0,6}(调|设|改)\\D{0,4}(?P<level>\\d+(?!成))"
          - "(亮度|屏幕亮).{0,6}(调|设|改)\\D{0,4}(?P<level>百分之[零一二两三四五六七八九十百]+|[零一二两三四五六七八九]成|\\d+成|半)"
          - "(?P<level>\\d+(?!成)).{0,4}(亮度|屏幕)"
          - "(?:屏幕|亮度).{0,4}(?:调|开|设)(?:到|成|为)?.{0,2}(?:最亮|最暗)"
        keywords: ["亮度", "屏幕亮度", "最亮", "最暗", "brightness", "screen brightness", "backlight"]
        slot_map_anchor: ["屏幕", "亮度", "背光", "显示器", "画面", "brightness", "screen", "backlight"]
        slot_map:
          拉满: {level: 100}
          开到最大: {level: 100}
          最亮: {level: 100}
          最大: {level: 100}
          百分百: {level: 100}
          百分之百: {level: 100}
          最暗: {level: 0}
          最小: {level: 0}
      local: "bright(level:0-100)"
    system:
      type: sysfs
      path: "/sys/class/backlight/*/brightness"

  adjust_brightness:
    display: "调节屏幕亮度"
    display_en: "Adjust the screen brightness relative to its current level. Use when the user asks to make the screen brighter/dimmer or says it is too dark/bright without a target level. Pass direction (up/down) and optional amount (default 10). For a specific target level use set_brightness."
    short: "bright_adj"
    aliases: ["adjust brightness", "brighten", "dim", "brighter", "dimmer", "调亮亮度", "调暗亮度", "亮度调亮", "亮度调暗", "屏幕太暗", "屏幕太亮"]
    params:
      direction: {type: str, enum: [up, down]}
      amount: {type: int, default: 10, range: [1, 100], unit: "%"}
    routes:
      rule:
        patterns:
          - "^(?:turn|make)\\s+(?:the\\s+)?(?:brightness|screen)\\s+(?:up|higher|brighter|down|lower|dimmer|darker)$"
          - "^(?:brighten|dim)(?:\\s+the\\s+screen)?$"
          - "^(?:亮|暗)(?:一点|一些|些|点)$"
          - "(?:屏幕|画面).{0,4}(?:刺眼|晃眼|太扎眼)"
          - "^(?:调|设)(?:亮|暗)(?:屏幕|画面|一点|一些)?$"
          - "^(?:调高|调亮|提高|增大)(?:一下|一点)?(?:亮度|屏幕亮度)$"
          - "^(?:调低|调暗|降低|减小)(?:一下|一点)?(?:亮度|屏幕亮度)$"
          - "^(?:亮度|屏幕亮度)(?:调高|调亮|调低|调暗|亮一点|暗一点)(?:一下|一点)?$"
        keywords: ["亮度", "屏幕亮度", "太暗", "看不清", "太亮", "刺眼", "晃眼", "brightness", "brighten", "dim", "dimmer", "darker", "调亮", "调暗"]
        slot_map_anchor: ["屏幕", "亮度", "背光", "显示器", "画面", "brightness", "screen", "backlight"]
        slot_map:
          亮一点: {direction: up, amount: 10}
          调亮: {direction: up, amount: 10}
          亮些: {direction: up, amount: 10}
          太暗: {direction: up, amount: 10}
          看不清: {direction: up, amount: 10}
          调高: {direction: up, amount: 10}
          暗一点: {direction: down, amount: 10}
          调暗: {direction: down, amount: 10}
          调低: {direction: down, amount: 10}
          太亮: {direction: down, amount: 10}
          刺眼: {direction: down, amount: 10}
          晃眼: {direction: down, amount: 10}
          调高亮度: {direction: up}
          调亮亮度: {direction: up}
          提高亮度: {direction: up}
          增大亮度: {direction: up}
          调低亮度: {direction: down}
          调暗亮度: {direction: down}
          降低亮度: {direction: down}
          减小亮度: {direction: down}
      local: "bright_adj(direction:up|down,amount:1-100)"
    system:
      type: sysfs
      path: "/sys/class/backlight/*/brightness"

  # ── 屏幕显示（display）──────────────────────────────────────────────
  # 与 set_brightness 同域。声明位置刻意排在 launch_app 之前：
  # _pattern_match 遇同置信度只保留先命中者，"开启扩展屏模式" 这类
  # 「动词+屏幕名词」输入才不会被 launch_app 吃掉（另见 launch_app 负向前瞻）。
  # 执行实现在 tools/display.py（合并进 tools/system.py::HANDLERS）：
  # 与设置中心 bianbu-displays 同路径——wlr-randr 即时生效 + 写
  # ~/.config/kanshi/config 并 SIGHUP 持久化。下方 cmd 仅作声明，
  # 真实调用带 --output/--json 参数并注入 Wayland 会话环境。

  set_resolution:
    display: "设置屏幕分辨率"
    display_en: "Change/adjust the screen resolution. Use when the user complains the resolution is too low or too high, the screen looks blurry, or text is too small or large, or asks to change the resolution. Do not use just to ask what the current resolution is (that is sys_resolution). For brightness use set_brightness; for UI scaling/zoom use set_aspect_ratio; for refresh rate use set_refresh_rate. Give an exact resolution via size (e.g. 1920x1080, optionally with a refresh rate 1920x1080@50) or a relative step via mode (up/down/max/min). Only resolutions the display really reports are accepted; use display_modes to list them."
    short: "setres"
    aliases: ["resolution", "分辨率", "屏幕分辨率", "显示分辨率"]
    params:
      # 相对档位走 mode；绝对值走 size（两者至少给一个，缺则执行层反问）。
      # mode 保留 enum 供端侧 grammar，另加 pattern 放行云端直给的 WxH。
      mode:
        type: str
        enum: [up, down, max, min]
        required: false
        pattern: "(?:up|down|max|min|\\d{3,4}\\s*[x×*]\\s*\\d{3,4}(?:\\s*@\\s*\\d{2,3}(?:\\.\\d+)?)?)"
        hint: "up/down/max/min，或具体分辨率如 1920x1080（可带 @50）"
      size: {type: str, required: false, hint: "目标分辨率，如 1920x1080 或 1920x1080@50"}
    routes:
      rule:
        # 只吃「调节」语义；"查看/看/显示分辨率" 归 sys_resolution（只读）
        patterns:
          - "^(?:set|change)\\s+(?:the\\s+)?screen\\s+resolution\\s+to\\s+(?P<mode>max|min|higher|lower)$"
          - "^(?:set|change)\\s+(?:the\\s+)?screen\\s+resolution\\s+to\\s+(?P<size>\\d{3,4}\\s*[x×*]\\s*\\d{3,4}(?:\\s*@\\s*\\d{2,3}(?:\\.\\d+)?)?)$"
          # 绝对值（WxH）直通：不命中则落回下面的调节语义 pattern，由执行层反问
          - "(?:分辨率|清晰度).{0,6}(?:调到|调成|设为|设成|设置成|改成|改为|换成|换为|到|成|为)\\s*(?<![\\d.])(?P<size>\\d{3,4}\\s*[x×*]\\s*\\d{3,4}(?:\\s*@\\s*\\d{2,3}(?:\\.\\d+)?)?)(?![\\d.])"
          - "(?:分辨率|清晰度).{0,6}(?:调|设|改|换)(?:到|成|为)?.{0,4}(?:最高|最大|最低|最小|高|低|大|小)"
          # 「分辨率在前 + 调节动作在后」但无程度词的口语（"分辨率帮我换一下"/
          # "把分辨率给我调整一下"）——旧 pattern 要求动作后带高/低/大/小，吃不到这类。
          # 动词集不含"设"（用"设成"），避免误伤只读锚点"分辨率设置"。
          - "(?:分辨率|清晰度).{0,6}(?:调整|换|调|改|设成|处理|弄)(?:一下|下|点儿|点)?"
          - "(?:调|设|改|换)(?:高|低|大|小)?.{0,4}(?:分辨率|清晰度)(?:调)?(?:高|低|大|小)?"
          - "(?:屏幕|画面|字).{0,8}(?:太糊|太模糊|看不清|太小|太大).{0,8}(?:分辨率|清晰度)"
          # 口语抱怨直通：分辨率太低/太高/太糊这类抱怨式表达在端侧规则层定死为
          # set_resolution（改），避免升级云端后被模型误选成只读的 sys_resolution（查）。
          - "(?:屏幕|显示|画面)?(?:分辨率|清晰度).{0,4}(?:太低|太高|太糊|太模糊|字太小|看不清)"
          # 口语直通：分辨率的事帮我看看（无显式调节动作词的"处理类"请求）
          - "(?:分辨率|清晰度).{0,6}(?:的事|的问题|这块).{0,10}(?:帮我|给我|麻烦|你).{0,8}(?:看看|处理|弄|调|换|搞定)"
        keywords: ["分辨率", "清晰度", "屏幕分辨率", "调分辨率", "分辨率调"]
        slot_map:
          最高: {mode: max}
          最大: {mode: max}
          最低: {mode: min}
          最小: {mode: min}
          调高: {mode: up}
          高点: {mode: up}
          太糊: {mode: up}
          太模糊: {mode: up}
          太低: {mode: up}
          太高: {mode: down}
          调低: {mode: down}
          低点: {mode: down}
          字太小: {mode: down}
          # ASCII 相对档位（"刷新率up"/"分辨率down"）：只在关键词「刷新率/分辨率」
          # 同时出现时才会走到 slot_map，故不会让裸 "up" 直通。
          up: {mode: up}
          down: {mode: down}
          max: {mode: max}
          min: {mode: min}
      local: "setres(mode:up|down|max|min|size:WxH如1920x1080)"
    system:
      type: shell
      cmd: "wlr-randr --output <out> --mode <WxH@rate>"

  set_refresh_rate:
    display: "设置屏幕刷新率"
    display_en: "Adjust the screen refresh rate (smoothness/frame rate). Use when the user asks for a high refresh rate, says the screen feels laggy or stuttery, wants a specific Hz value such as 50Hz, or wants to lower the rate to save power. Give an exact refresh rate via rate (Hz, e.g. 50) or a relative step via mode (up/down/max/min). Only rates the display really reports are accepted; use display_modes to list them. For resolution use set_resolution; for brightness use set_brightness."
    short: "setrate"
    aliases: ["refresh", "刷新率", "高刷", "帧率"]
    params:
      # 相对档位走 mode；绝对值走 rate（Hz）。两者至少给一个，缺则执行层反问。
      mode:
        type: str
        enum: [up, down, max, min]
        required: false
        pattern: "(?:up|down|max|min|\\d{2,3}(?:\\.\\d+)?)"
        hint: "up/down/max/min，或具体刷新率 Hz 如 50 / 59.94"
      # float：小数刷新率（59.94/29.97）必须原样传下来，int 会把 59.94 截成错值
      rate:
        type: float
        required: false
        pattern: "\\d{2,3}(?:\\.\\d+)?"
        hint: "目标刷新率（Hz），如 50 / 59.94"
    routes:
      rule:
        patterns:
          - "^(?:set|change)\\s+(?:the\\s+)?refresh\\s+rate\\s+to\\s+(?P<rate>\\d{2,3}(?:\\.\\d+)?)\\s*Hz$"
          # 绝对值（Hz）直通："刷新率调到50Hz"/"刷新率设成50"/"刷新率调为59.94hz"
          # 数字两侧加 (?<![\d.])/(?![\d.]) 断言：否则 ".{0,6}" 会把 59.94 从中间切开，
          # 只剩 "94hz" 能匹配，用户就被报「不支持 94Hz」。
          - "(?:刷新率|帧率).{0,6}(?:调到|调成|调整到|设为|设成|设置成|改成|改为|换成|换为|到|成|为)?\\s*(?<![\\d.])(?P<rate>\\d{2,3}(?:\\.\\d+)?)(?![\\d.])\\s*(?:Hz|hz|HZ|赫兹|帧|fps)?"
          # 带 Hz 单位的句子一律按刷新率处理（"分辨率调到50Hz" 里的 Hz 只可能指刷新率）
          - "(?:分辨率|清晰度|屏幕|显示).{0,4}(?:调到|调成|设为|设成|改成|改为|到|成|为)\\s*(?<![\\d.])(?P<rate>\\d{2,3}(?:\\.\\d+)?)(?![\\d.])\\s*(?:Hz|hz|HZ|赫兹)"
          - "(?:刷新率|帧率).{0,6}(?:调|设|改|开)(?:到|成|为)?.{0,4}(?:最高|最大|最低|最小|高|低)"
          - "(?:调|设|改|开)(?:高|低)?.{0,4}(?:刷新率|帧率)(?:调)?(?:高|低)?"
          - "^(?:开|打开|开启|切到).{0,2}(?:高刷|高帧)(?:模式)?$"
          - "(?:省电|降耗|费电).{0,6}(?:刷新率|帧率).{0,4}(?:调低|降低|低点)"
        keywords: ["刷新率", "高刷", "帧率", "调刷新率", "刷新率调"]
        slot_map:
          最高: {mode: max}
          最大: {mode: max}
          最低: {mode: min}
          最小: {mode: min}
          高刷: {mode: max}
          调高: {mode: up}
          高点: {mode: up}
          调低: {mode: down}
          低点: {mode: down}
          # ASCII 相对档位（"刷新率up"）：见 set_resolution 同名说明
          up: {mode: up}
          down: {mode: down}
          max: {mode: max}
          min: {mode: min}
      local: "setrate(mode:up|down|max|min|rate:数字Hz)"
    system:
      type: shell
      cmd: "wlr-randr --output <out> --mode <WxH@rate>"

  display_modes:
    display: "查看屏幕支持的显示模式"
    display_en: "List every display output with the resolutions and refresh rates it supports, marking the current one (read-only). Use when the user asks which refresh rates or resolutions are supported or available, e.g. 'which refresh rates are supported'. To change them use set_refresh_rate or set_resolution."
    short: "modes"
    aliases: ["display_modes", "支持的刷新率", "支持的分辨率", "可用刷新率", "可用分辨率", "显示模式列表"]
    params: {}
    routes:
      rule:
        patterns:
          # 全匹配（置信度 1.0）优先：只读查询与写工具的弱命中会打平在 0.85，
          # 打平后由注册顺序决定，所以用锚定 pattern 把「查询语义」钉死。
          # 必须带查询标记（可用/支持/有哪些/多高…）：裸「分辨率」「刷新率」不能被
          # 吃掉——那是 sys_resolution 的 keyword（test_skill_routes 有护栏）。
          - "^(?:可用|可选的|支持的|可选)(?:刷新率|帧率|分辨率|清晰度|显示模式|屏幕模式)(?:有哪些|是什么|是多少)?$"
          - "^(?:屏幕|显示器|显示屏|显示|这台|这台机器|本机|系统)?(?:能|可以|支持)?(?:调到多高|调多高|能到多高|能有多高|最高能到多少|最高能到|最高多少|最高支持多少|最高支持|最大支持)(?:刷新率|帧率|帧|赫兹|分辨率|清晰度|显示模式|屏幕模式)(?:有哪些|都有哪些|有哪些档|有几档)?$"
          - "^(?:屏幕|显示器|显示屏|显示|这台|这台机器|本机|系统)?(?:刷新率|帧率|帧|赫兹|分辨率|清晰度|显示模式|屏幕模式)(?:有哪些|都有哪些|有哪些档|有几档)$"
          - "^(?:show|list|what|which)\\s+.*(?:refresh\\s+rate|resolution|display\\s+mode)s?\\s*(?:are|is)?\\s*(?:supported|available)\\??$"
          # 「查看/看/显示 + 支持/可用/可选/多少 + 档位词」；裸「查看分辨率」不吃，
          # 那是 sys_resolution（当前值）的语义
          - "(?:查看|查|看|看看|显示|列出|列|告诉我|说说).{0,4}(?:支持|可用|可选|能调|可调|有哪些|多少|几档).{0,6}(?:刷新率|帧率|帧|赫兹|分辨率|清晰度|显示模式|屏幕模式)"
          - "(?:有哪些|支持哪些|支持什么|支持哪几种|都有哪些|能调哪些|可以调哪些|可选哪些|有哪些可选).{0,8}(?:刷新率|帧率|帧|赫兹|分辨率|清晰度|显示模式|屏幕模式)"
          - "(?:刷新率|帧率|分辨率|清晰度|显示模式|屏幕模式).{0,8}(?:有哪些|有几种|有几档|几档|多少种|有多少|哪几种|支持哪些|支持什么|都有哪些|可以选哪些|能选哪些|可选的|可选值|支持的|列表)"
          # 量词/程度类口语：「屏幕支持多少刷新率」「能上多少刷新率」
          - "(?:支持|可用|可选|最高|最大|能上|能跑|能到|可达).{0,4}(?:多少|哪些|几档|几种|几多).{0,4}(?:刷新率|帧率|帧|赫兹|分辨率|清晰度|显示模式|屏幕模式)"
          - "(?:最高|支持|可用|可选).{0,4}(?:刷新率|帧率|分辨率|清晰度|显示模式).{0,4}(?:是多少|多少|是什么|是哪些|分别是多少)"
        keywords: ["支持哪些刷新率", "支持哪些分辨率", "可用刷新率", "可用分辨率", "刷新率有哪些", "分辨率有哪些", "显示模式列表", "支持多少刷新率", "刷新率有几档", "支持哪些显示模式", "可用显示模式", "显示模式有哪些"]
      local: "modes()"
    system:
      type: proc
      mcp:
        group: readonly

  rotate_screen:
    display: "旋转屏幕"
    display_en: "Rotate the screen orientation (landscape/portrait/upside-down). Use when the user asks to rotate or flip the screen, or switch between landscape and portrait. For external monitor extend/mirror modes use set_display_mode; for resolution use set_resolution."
    short: "rotate"
    aliases: ["rotate", "旋转", "横屏", "竖屏", "屏幕方向", "显示方向"]
    params:
      angle: {type: int, range: [0, 270], default: 90}
    routes:
      rule:
        patterns:
          - "(?:把|将)?(?:屏幕|画面|显示|显示器).{0,4}(?:旋转|转)(?:到|成)?\\D{0,2}(?P<angle>\\d+)\\s*度?"
          - "(?:旋转|转)(?:一下)?(?:屏幕|画面|显示|显示器)"
          - "(?:把|将)(?:屏幕|画面|显示|显示器)(?:旋转|转)(?:一下|一圈)?$"
          - "^(?:屏幕|画面|显示)?(?:切换到|切到|设为|设成)?(?:横屏|竖屏)(?:模式)?$"
          - "(?:把|将)?(?:屏幕|画面|显示).{0,4}(?:倒过来|翻过来|反过来|颠倒)"
          - "(?:屏幕|画面|显示).{0,2}方向.{0,4}(?:反了|错了|不对|转|调)"
          - "(?:把|将)?(?:屏幕|画面|显示|显示器).{0,2}(?:竖起来|竖过来|竖着|竖放)"
          - "(?:把|将)?(?:屏幕|画面|显示|显示器).{0,2}(?:横过来|横着|横放)"
        keywords: ["旋转屏幕", "屏幕旋转", "横屏", "竖屏", "屏幕方向", "显示方向", "屏幕倒"]
        slot_map:
          竖屏: {angle: 90}
          横屏: {angle: 0}
          倒过来: {angle: 180}
          翻过来: {angle: 180}
          反过来: {angle: 180}
          颠倒: {angle: 180}
          竖起来: {angle: 90}
          竖过来: {angle: 90}
          竖着: {angle: 90}
          竖放: {angle: 90}
          横过来: {angle: 0}
          横着: {angle: 0}
          横放: {angle: 0}
      local: "rotate(angle:0|90|180|270)"
    system:
      type: shell
      cmd: "wlr-randr --output <out> --transform normal|90|180|270"

  set_aspect_ratio:
    display: "设置屏幕缩放比例"
    display_en: "Set the display scaling/zoom ratio (size of UI elements). Use when the user says the interface, text, or icons are too small or too large and wants to zoom in/out or reset the scale. For resolution use set_resolution; for brightness use set_brightness."
    short: "setratio"
    aliases: ["scale", "缩放", "比例", "屏幕比例", "缩放比例", "显示比例"]
    params:
      # 缩放倍率，只支持这五档；刻意不给 default——无值时让执行层反问，
      # 避免模型漏参时被静默重置成 1.00。
      # pattern 放行 enum 之外的写法（1 / 1.5 / 125%），由执行层归一化到五档之一。
      ratio:
        type: str
        enum: ["1.00", "1.25", "1.50", "1.75", "2.00"]
        pattern: "\\d{1,3}(?:\\.\\d+)?\\s*%?|\\d{1,2}\\s*倍"
        hint: "如 1.25，也可说 1 / 1.5 / 125%"
    routes:
      rule:
        # 数值多数交给 slot_map 归一到 "1.50" 这类规范值；但 slot_map 是子串匹配，
        # 裸 "1"/"2" 放进去会命中任何含 1 的句子，所以整数/小数/百分比由下面这条
        # 命名捕获组抽取，执行层再归一化（"1"→1.00、"150"→1.50、"125%"→1.25）。
        patterns:
          - "^(?:set|change)\\s+(?:the\\s+)?aspect\\s+ratio\\s+to\\s+(?P<ratio>\\d+:\\d+)$"
          # 两侧断言防止 ".{0,6}" 把 "1.25" 从中间切开只吃到 "25"
          - "(?:屏幕|画面|显示|界面)?\\s*(?:缩放|比例).{0,6}(?<![\\d.])(?P<ratio>\\d{1,3}(?:\\.\\d+)?\\s*%?)(?![\\d.%])"
          - "(?:屏幕|画面|显示|界面)?.{0,2}(?:缩放)?比例.{0,4}(?:调|设|改|换|恢复)(?:成|到|为)?.{0,8}"
          - "(?:缩放|比例).{0,6}(?:1\\.00|1\\.25|1\\.50|1\\.75|2\\.00|1\\.5|2\\.0|100%|125%|150%|175%|200%)"
          - "(?:把|将)?(?:屏幕|画面|显示|界面|字|图标).{0,6}(?:放大|缩小).{0,6}"
          - "(?:屏幕|画面|显示|界面).{0,4}(?:缩放).{0,4}(?:调|设|改)(?:大|小|成|到|为)?.{0,6}"
          - "(?:字|图标|界面).{0,4}(?:太小|太大).{0,8}(?:放大|缩小|调大|调小|缩回|比例|缩放).{0,4}"
        keywords: ["屏幕比例", "缩放比例", "显示比例", "屏幕缩放", "缩放倍率", "放大界面", "缩小界面"]
        slot_map:
          # 显式倍率。键是子串匹配，故 "1.5" 同时吃 "1.5" 和 "1.50"，
          # 无需再列 "1.50"；"1.0"/"2.0" 同理覆盖 "1.00"/"2.00"。
          "1.0": {ratio: "1.00"}
          "100%": {ratio: "1.00"}
          "1倍": {ratio: "1.00"}
          "1.25": {ratio: "1.25"}
          "125%": {ratio: "1.25"}
          "1.5": {ratio: "1.50"}
          "150%": {ratio: "1.50"}
          "1.75": {ratio: "1.75"}
          "175%": {ratio: "1.75"}
          "2.0": {ratio: "2.00"}
          "200%": {ratio: "2.00"}
          "2倍": {ratio: "2.00"}
          "两倍": {ratio: "2.00"}
          # 无倍率的口语：给确定性档位，别让 1B 猜
          恢复默认: {ratio: "1.00"}
          还原: {ratio: "1.00"}
          默认比例: {ratio: "1.00"}
          原始比例: {ratio: "1.00"}
          不缩放: {ratio: "1.00"}
          缩回: {ratio: "1.00"}
          最小: {ratio: "1.00"}
          放大: {ratio: "1.50"}
          调大: {ratio: "1.50"}
          大一点: {ratio: "1.50"}
          太小: {ratio: "1.50"}
          看不清: {ratio: "1.50"}
          缩小: {ratio: "1.25"}
          调小: {ratio: "1.25"}
          小一点: {ratio: "1.25"}
          太大: {ratio: "1.25"}
          最大: {ratio: "2.00"}
      local: "setratio(ratio:1.00|1.25|1.50|1.75|2.00)"
    system:
      type: shell
      cmd: "wlr-randr --output <out> --scale {ratio}"

  set_display_mode:
    display: "设置外接屏显示模式"
    display_en: "Set the external monitor display mode: extend, mirror/duplicate, primary-only, or secondary-only. Use when the user asks to extend or duplicate screens, or set a primary/secondary display. For rotation use rotate_screen; for resolution use set_resolution."
    short: "dispmode"
    aliases: ["display_mode", "扩展屏", "复制屏", "投屏", "双屏", "主屏", "副屏"]
    params:
      mode: {type: str, enum: [extend, mirror, primary, secondary]}
    routes:
      rule:
        patterns:
          - "^(?:switch\\s+to|set\\s+to|change\\s+to|enable)\\s+(?:the\\s+)?(?P<mode>extend|extended|mirror|mirrored|duplicate|primary|secondary)\\s+(?:display\\s+)?(?:mode)?$"
          - "^(?:mirror|duplicate)\\s+(?:the\\s+)?(?:screens?|displays?)$"
          - "(?:开启|打开|切换到|切到|设为|设成|用).{0,4}(?:扩展屏|扩展模式|扩展)(?:模式|显示)?"
          - "(?:开启|打开|切换到|切到|设为|设成|用).{0,4}(?:复制屏|复制模式|复制|镜像)(?:模式|显示)?"
          - "(?:外接|第二|副)(?:显示屏|屏幕|屏).{0,6}(?:设为|设成|切换?到?|改成).{0,4}(?:复制|扩展|镜像)"
          - "^只在(?P<which>主屏|副屏|外接屏|第二屏).{0,2}显示$"
          - "(?:把|将).{0,4}(?:电脑|笔记本)?(?:画面|屏幕|内容).{0,4}(?:投|投射|投影|镜像)(?:到|上).{0,6}"
          - "(?:让|使).{0,4}(?:两个|双)(?:屏幕|屏).{0,8}(?:不一样|不同|各自|分别)"
          - "(?:外接|第二|副)(?:屏幕|显示屏|屏).{0,8}(?:没画面|黑屏|没显示|没信号).{0,8}(?:切|调|换)"
          # 口语直通：双屏显示的配置/事/这块 + 弄/处理/调/动，规则层定死，
          # 绕开 1B 因 aliases 里 "display/屏幕" 把双屏误选成 set_brightness。
          - "双屏.{0,6}(?:配置|设置|模式|事|这块|这|弄|处理|调|动|搞|改)"
          - "^(?:打开|开启|启用)\\s*(?:外接屏|第二屏|副屏)(?:模式)?$"
        keywords: ["扩展屏", "复制模式", "镜像模式", "投屏", "外接显示屏", "双屏显示", "主屏显示", "副屏显示"]
        slot_map:
          扩展: {mode: extend}
          复制: {mode: mirror}
          镜像: {mode: mirror}
          投: {mode: mirror}
          主屏: {mode: primary}
          副屏: {mode: secondary}
          外接屏: {mode: extend}
          第二屏: {mode: extend}
          # 描述性口语（无"扩展/复制"字样）：mode 无默认值，不定值会被
          # 执行层当缺参反问，故按语义归档。
          不一样: {mode: extend}
          不同: {mode: extend}
          各自: {mode: extend}
          没画面: {mode: extend}
          黑屏: {mode: extend}
          没信号: {mode: extend}
      local: "dispmode(mode:extend|mirror|primary|secondary)"
    system:
      type: shell
      cmd: "wlr-randr --output <out> --on/--off --pos x,y"

  window_list:
    display: "查询窗口/应用列表"
    display_en: "List currently open windows/applications. Use when the user asks which windows or apps are open. For launching apps use launch_app; for closing apps use close_app."
    short: "winlist"
    aliases: ["window_list", "windows", "窗口列表", "应用列表", "所有窗口", "列出窗口"]
    params: {}
    routes:
      rule:
        patterns:
          - "^(?:show|list)\\s+(?:all\\s+)?open\\s+windows$"
          - "^(?:查询|查看|看看|列出|显示|打开)?\\s*(?:当前|所有)?(?:窗口|应用)列表$"
          - "^(?:有哪些|列出|看看|查看|显示)\\s*(?:当前)?窗口$"
          - "^(?:所有|当前)窗口$"
        keywords: ["窗口列表", "应用列表", "所有窗口", "有哪些窗口", "列出窗口"]
      local: "winlist()"
    system:
      type: shell
      cmd: "wlrctl toplevel list"
      mcp:
        group: readonly

  window_activate:
    display: "切换/激活窗口"
    display_en: "Switch to or bring a window/application to the foreground. Use when the user asks to switch to, activate, or focus a specific window or app."
    short: "winact"
    aliases: ["window_activate", "switch", "切换窗口", "激活窗口", "切换", "激活"]
    params:
      target: {type: str}
    routes:
      rule:
        patterns:
          - "切换(?:到|至|换到)?\\s*(?P<target>.{0,20}(?:窗口|应用|程序|软件|浏览器|编辑器|终端).*?)$"
          - "激活\\s*(?P<target>.{0,20}(?:窗口|应用|程序|软件|浏览器|编辑器|终端).*?)$"
          - "(?:把|将)?\\s*(?P<target>.+?)(?:窗口|应用)\\s*(?:切换|激活|调出|拉出|打开)"
        keywords: ["切换", "激活", "切换窗口", "激活窗口", "窗口"]
        # §4.4-C 候选注入护栏：裸「切换/激活/窗口」过宽，会把「切换kernel」这类
        # 改写/切换其它对象（内核、显示模式、音频输出…）误注入窗口工具。
        # 弱命中必须句中出现窗口/应用直接宾语之一。
        require_object: ["窗口", "应用", "程序", "软件", "浏览器", "编辑器", "终端"]
      local: "winact(target:窗口名或应用名)"
    system:
      type: shell
      cmd: "wlrctl toplevel activate app_id:<target>"

  window_minimize:
    display: "最小化窗口"
    display_en: "Minimize a window. Use when the user asks to minimize a specific window or app. For maximizing use window_maximize."
    short: "winmin"
    aliases: ["window_minimize", "minimize", "最小化窗口", "最小化"]
    params:
      target: {type: str}
    routes:
      rule:
        patterns:
          - "最小化\\s*(?!音量|声音|亮度|屏幕|背光)(?P<target>.+)$"
          - "把\\s*(?!音量|声音|亮度|屏幕|背光)(?P<target>.+?)\\s*最小化$"
        keywords: ["最小化", "最小化窗口"]
      local: "winmin(target:窗口名或应用名)"
    system:
      type: shell
      cmd: "wlrctl toplevel minimize app_id:<target>"

  window_maximize:
    display: "最大化窗口"
    display_en: "Maximize a window. Use when the user asks to maximize a specific window or app. For minimizing use window_minimize."
    short: "winmax"
    aliases: ["window_maximize", "maximize", "最大化窗口", "最大化"]
    params:
      target: {type: str}
    routes:
      rule:
        patterns:
          - "最大化\\s*(?!音量|声音|亮度|屏幕|背光)(?P<target>.+)$"
          - "把\\s*(?!音量|声音|亮度|屏幕|背光)(?P<target>.+?)\\s*最大化$"
        keywords: ["最大化", "最大化窗口"]
      local: "winmax(target:窗口名或应用名)"
    system:
      type: shell
      cmd: "wlrctl toplevel maximize app_id:<target>"


  mute:
    display: "静音/取消静音"
    display_en: "Mute or unmute the system output sound. Use when the user asks to mute, unmute, or silence the speakers/audio. For setting a volume level use set_volume; for muting the microphone use audio_input_mute."
    short: "mute"
    params:
      "on": {type: bool, default: true}
    routes:
      rule:
        patterns:
          - "^(?:mute|unmute)(?:\\s+the)?\\s+(?:system\\s+)?(?:sound|audio|volume)$"
          - "^静音$"
          - "(开启|打开)静音"
