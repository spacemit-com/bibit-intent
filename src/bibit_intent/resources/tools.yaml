          - "^(?:别出声|不出声)$"
        keywords: ["静音"]
        slot_map: {"取消静音": {"on": false}, "关闭静音": {"on": false}, "解除静音": {"on": false}, "unmute audio": {"on": false}, "unmute the sound": {"on": false}, "unmute sound": {"on": false}}
