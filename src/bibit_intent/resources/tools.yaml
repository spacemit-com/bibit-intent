    display_en: "Open a local file or document with its default desktop application. Use this after file_search returns a file path and the user asks to open it, or when the user gives an explicit file path. Do not use launch_app for document files and do not run libreoffice/xdg-open in terminal; launch_app only starts an application without a file."
    short: "openfile"
    aliases: ["open file", "open document", "open local file", "打开文件", "打开文档", "用默认应用打开", "打开这个文件"]
    params:
      path: {type: str}
    routes:
