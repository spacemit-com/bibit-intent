    routes:
      rule:
        # 负向前瞻 + 特例豁免：紧跟"打开/启动/运行/开启"的若是硬件设备/系统功能
        # 关键词（蓝牙/WiFi/摄像头等），交给对应硬件 skill；但如果这些词后跟应用
