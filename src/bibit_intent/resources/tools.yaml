  camera_open:
    display: "打开相机"
    display_en: "Open the camera application (snapshot). Use only when the user asks to open, launch, or start the camera app. For actually capturing a picture use take_photo; for closing the camera use camera_close."
    short: "cam_on"
    aliases: ["camera", "相机", "摄像头"]
    params: {}
    routes:
      rule:
        patterns:
          - "^(?:帮我)?(?:打开|启动|开启|运行)(?:一下)?.{0,4}(相机|摄像头|照相机)(?:应用|软件|程序)?$"
          - "^(相机|摄像头)(?:给我)?(?:打开|启动|开启)(?:一下)?$"
          - "^(?:open|launch|start)\\s+(?:the\\s+)?camera(?:\\s+app)?$"
        keywords: ["打开相机", "打开摄像头", "启动相机", "open camera"]
      local: "cam_on()"
    system:
      type: shell
      cmd: "snapshot &"

  take_photo:
    display: "拍照"
    display_en: "Capture a still photo with the camera. Use when the user asks to take a photo, take a picture, or take a selfie, e.g. 拍照 / 拍个照 / 照相 / 自拍. Opens the camera if it is not running and returns to the capture page if the gallery is showing. For opening the camera app without capturing use camera_open."
    short: "camsnap"
    aliases: ["take photo", "take a photo", "take picture", "take a picture", "selfie", "拍照", "照相", "自拍"]
    params: {}
    routes:
      rule:
        patterns:
          - "^(?:我)?想(?:要)?(?:拍照|照相|自拍|拍个照|拍张照|拍一张|照张相|拍个自拍)$"
          - "^(?:帮我|给我)?(?:拍照|照相|自拍|拍个照|拍张照|拍一张|照张相|拍个自拍)(?:吧|啊|呀)?$"
          - "^I\\s+want\\s+to\\s+(?:take\\s+)?(?:a\\s+)?(?:photo|picture|selfie)$"
          - "^(?:take|snap)\\s+(?:a\\s+)?(?:photo|picture|selfie)$"
        keywords: ["拍照", "照相", "自拍", "拍个照", "拍张照"]
      local: "camsnap()"
    system:
      # 执行走 HANDLERS["take_photo"]（AT-SPI 触发 snapshot 的 take-picture 动作），
      # 此处 cmd 仅作声明，不参与执行。
      type: shell
      cmd: "AT-SPI win.take-picture"
      mcp:
        group: control

  camera_close:
    display: "关闭相机"
    display_en: "Close the camera app. Use when the user asks to close or exit the camera, or is done taking photos. For opening the camera use camera_open."
    short: "cam_off"
    aliases: ["相机", "摄像头"]
    params: {}
    routes:
      rule:
        patterns:
          - "^(?:帮我)?(?:关闭|退出|停止|结束)(?:一下)?.{0,4}(相机|摄像头|照相机)(?:应用|软件|程序)?$"
          - "^(?:不(?:拍照|照相)(?:了)?|(?:拍照|照相)(?:了)?(?:关掉|关闭|退出|结束|停止)(?:相机|摄像头)?|(?:拍照|照相)(?:了)?(?:相机|摄像头)(?:关掉|关闭|退出|结束|停止)?)$"
          - "^(相机|摄像头)(?:给我)?(?:关闭|关掉|退出)(?:一下)?$"
          - "^(?:close|exit|stop)\\s+(?:the\\s+)?camera(?:\\s+app)?$"
          - "^done\\s+taking\\s+photos$"
        keywords: ["关闭相机", "camera", "close"]
      local: "cam_off()"
    system:
      type: shell
      cmd: "pkill -x snapshot"

  audio_output_switch:
    display: "切换音频输出设备"
    display_en: "Switch the audio output device (speaker/analog, headphone, HDMI, DP). Use when the user asks to change where sound plays from, e.g. switch to analog/speaker/headphone/HDMI. The built-in ES8326 codec is analog; identifiers such as snd-es8326, snd-8326, es8326 should be passed as device=analog. For switching the microphone/input device use audio_input_switch; for volume use set_volume."
    short: "audio_out"
    aliases: ["output", "sink", "输出设备", "扬声器", "喇叭", "耳机", "模拟输出", "snd-es8326", "snd-8326", "es8326"]
    params:
      device: {type: str, enum: [speaker, headphone, hdmi, dp, analog, auto, snd-es8326, snd_es8326, sndes8326, snd-8326, snd8326, es8326], default: auto}
    routes:
      rule:
        patterns:
          - "(切换|换|改为|更改|改|设)(?:到|成|为)?(?!.{0,2}(?:蓝牙|无线)).{0,4}(扬声器|喇叭|外放|音箱)"
          - "(切换|换|改为|更改|改|设)(?:到|成|为)?(?!.{0,2}(?:蓝牙|无线)).{0,4}(耳机|有线耳机)"
          - "(切换|换|改为|更改|改|设)(?:到|成|为)?.{0,4}(HDMI|hdmi|DP|dp|显示器)(?:音频|声音|输出)?"
          - "(切换|换|改为|更改|改|设)(?:到|成|为)?.{0,4}(snd[-_ ]?(?:es)?8326|es8326|ES8326|snd8326|SND8326|模拟(?:输出|音频))"
          - "(声音|音频).{0,4}(输出|播放).{0,4}(切换|换|改为|更改|改)"
          - "(?:切|换|转)(?:到|成|为|回)(?!.{0,2}(?:蓝牙|无线)).{0,4}(扬声器|喇叭|外放|音箱)"
          - "(?:切|换|转)(?:到|成|为|回)(?!.{0,2}(?:蓝牙|无线)).{0,4}(耳机|有线耳机)"
          - "(?:切|换|转)(?:到|成|为|回).{0,4}(HDMI|hdmi|DP|dp|显示器)(?:音频|声音|输出)?"
          - "(?:切|换|转)(?:到|成|为|回).{0,4}(snd[-_ ]?(?:es)?8326|es8326|ES8326|snd8326|SND8326|模拟(?:输出|音频))"
          - "(?:从|由)(?:耳机|扬声器|喇叭|外放|音箱).{0,6}(?:切|换|转)(?:到|成|为|回)(?!.{0,2}(?:蓝牙|无线)).{0,4}(扬声器|喇叭|外放|音箱|耳机|有线耳机)"
          - "^(?:switch|change)\\s{1,3}(?:to|audio\\s{1,3}output\\s{1,3}to)\\s{1,3}(?:speakers?|headphones?|HDMI\\s{1,3}output)$"
          - "^I\\s{1,3}want\\s{1,3}to\\s{1,3}use\\s{1,3}the\\s{1,3}speakers?$"
          - "^switch\\s{1,3}audio\\s{1,3}output\\s{1,3}device$"
        # Keep generic headphone phrases available through the patterns above;
        # omitting the bare "耳机" keyword avoids hijacking Bluetooth headset
        # intents (e.g. "蓝牙耳机", "旧耳机").
        keywords: ["输出设备", "扬声器", "喇叭", "切换输出", "output", "speaker", "headphone"]
        slot_map_anchor: ["切换", "换", "改", "switch", "change"]
        slot_map_neg_lookbehind: ["蓝牙", "无线"]
        slot_map:
          扬声器: {device: speaker}
          喇叭: {device: speaker}
          外放: {device: speaker}
          音箱: {device: speaker}
          耳机: {device: headphone}
          有线耳机: {device: headphone}
          speaker: {device: speaker}
          speakers: {device: speaker}
          headphone: {device: headphone}
          headphones: {device: headphone}
          HDMI: {device: hdmi}
          hdmi: {device: hdmi}
          DP: {device: dp}
          dp: {device: dp}
          显示器: {device: hdmi}
          模拟: {device: analog}
          模拟输出: {device: analog}
          analog: {device: analog}
          snd-8326: {device: analog}
          snd-es8326: {device: analog}
          snd_es8326: {device: analog}
          sndes8326: {device: analog}
          snd8326: {device: analog}
          es8326: {device: analog}
          ES8326: {device: analog}
      local: "audio_out(device:speaker|headphone|hdmi|dp|analog|auto)"
