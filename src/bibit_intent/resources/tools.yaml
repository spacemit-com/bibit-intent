        # 第一条pattern专门处理"硬件词+应用后缀"的合法应用名。
        patterns:
          - "^(?:please\\s+)?(?:open|launch|start|run)\\s+(?:the\\s+)?(?!benchmark$|script$|tests?$|backups?$|updates?$|upgrades?$|diagnostic(?:s)?$|commands?$|tasks?$|jobs?$|services?$|process(?:es)?$|logs?$|syncs?$|prox(?:y|ies)$|firewall$|recording$|location$|bluetooth$|wi-?fi$|camera$|microphones?$|mics?$|speakers?$|headphones?$|ethernet$|nic$|music$|videos?$|audios?$|songs?$|movies?$|playlists?$|files?$|documents?$|folders?$|director(?:y|ies)$|windows?$|lids?$|doors?$|box(?:es)?$|books?$|pages?$|tabs?$|curtains?$|drawers?$|cabinets?$|blinds?$|deals?$)(?P<app_name>[a-zA-Z0-9_-]+)$"
          - "^(?:please\\s+)?(?:open|launch|start|run)\\s+(?:the\\s+)?(?P<app_name>[a-zA-Z0-9][a-zA-Z0-9 _-]{0,30}?)(?:\\s+app|\\s+application)$"
          # 特例豁免：硬件关键词 + 应用后缀 = 合法应用名（如"蓝牙设置""WiFi管理器"）
          - "^(?:帮我)?(?:打开|启动|运行|开启)\\s*(?P<app_name>(?:蓝牙|WiFi|wifi|WIFI|wi-fi|Wi-Fi|无线|摄像头|相机|麦克风|话筒|扬声器|喇叭|耳机|有线|以太网|网卡|省电|低功耗|高性能|性能模式|CPU|Boost|加速|超频|静音|飞行)(?:设置|管理器|面板|中心|应用|程序|软件|控制|助手))$"
          # 通用规则：排除单独的硬件关键词（无后缀）+ 排除"XX服务"（交给 service_start）
          - "^(?:帮我)?(?:打开|启动|运行|开启)\\s*(?!一下|那个|这个|正在|现在|一会儿|在跑的|蓝牙(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|WiFi(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|wifi(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|WIFI(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|wi-fi|Wi-Fi|无线(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|摄像头(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|相机(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|麦克风|话筒|扬声器|喇叭|耳机|有线|以太网|网卡|省电|低功耗|高性能|性能模式|CPU|Boost|加速|超频|静音|飞行|nat|NAT|ip转发|IP转发|端口转发|防火墙(?![一-龥])|自动更新(?![一-龥])|录音(?![一-龥])|定位(?![一-龥])|脚本(?![一-龥])|日志(?![一-龥])|备份(?![一-龥])|同步(?![一-龥])|代理(?![一-龥])|进程(?![一-龥])|多久|多长时间|时间|上限|限制|(?:的)?文件(?!管理器|管理|系统|夹)|窗口|应用列表|所有窗口)(?P<app_name>[a-zA-Z0-9\\-_一-龥]+?)(?<!服务)$"
        keywords: ["打开", "启动", "运行", "开启", "应用", "程序", "open", "launch", "start", "run"]
      local: "launch(app:...)"
    system:
      type: app_control
