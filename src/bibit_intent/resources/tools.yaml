  get_system_info:
    display: "查询系统状态"
    display_en: "Query system status: CPU usage, memory, temperature, or disk usage. Use when the user asks about CPU/memory/temperature/disk status, or whether the machine is busy or hot. For a specific process list use proc_list; for disk partitions use disk_partitions."
    short: "sysinfo"
    aliases: ["cpu", "memory", "mem", "temperature", "temp", "disk", "status", "sysinfo", "占用", "卡不卡", "整机状态"]
    params:
      item: {type: str, enum: [cpu, memory, temp, cpu_temp, disk, all], default: all}
    routes:
      rule:
        patterns:
          - "(?!.*(?:USB|usb))(?:查看|查|看|显示|看看).{0,6}(?:系统|设备|机器|整机)(?!.{0,4}(?:IP|ip|地址)).{0,4}(?:状态|情况|状况|信息|运行|性能|怎么样|如何)"
          # “查看cpu和cpu温度/查看cpu温度以及cpu”同时要 CPU 与温度，
          # 用更具体的 slot_map 组合词固定 item，避免“查看cpu和内存温度”误判。
          - "^(?:查看|查|看|显示|看看)(?:一下|下)?(?:当前|现在)?(?:CPU|cpu|处理器)(?:和|及|与|还有|以及)(?:当前|现在)?(?:CPU|cpu)?(?:的)?温度(?:信息|状态|情况|多少|高|低|几度)?$"
          - "^(?:查看|查|看|显示|看看)(?:一下|下)?(?:当前|现在)?(?:CPU|cpu)?温度(?:和|及|与|还有|以及)(?:当前|现在)?(?:CPU|cpu|处理器)(?:信息|状态|情况|多少|高|低|几度)?$"
          - "^(?:[Ss]how|[Vv]iew|[Cc]heck|[Dd]isplay|[Gg]et)\\s+(?:the\\s+)?(?:CPU|cpu|[Pp]rocessor)\\s+and\\s+(?:(?:CPU|cpu)\\s+)?[Tt]emperature$"
          # 先匹配“查看 CPU 温度/温度”，避免被下面的“查看 CPU”规则抢走。
          - "(?:查看|查|看|显示|看看).{0,4}(?:温度|CPU温度|cpu温度|机器温度|设备温度).{0,4}(?:多少|高|低|状态|信息|几度)?"
          - "^(?:[Ss]how|[Vv]iew|[Cc]heck|[Dd]isplay|[Gg]et)\\s+(?:the\\s+)?(?:CPU\\s+)?[Tt]emperature(?:\\s+(?:info|status))?$"
          # CPU 占用状态查询："现在CPU占用高吗/CPU使用率" → 只读直通，
          # 避免口语查询漏给 1B 后波动（实测在 vol/sysinfo/topcpu 间乱选）。
          - "(?:CPU|cpu|处理器).{0,6}(?!.{0,3}(?:最高|最多|排行|排名|top))(?:占用|使用|使用率|占用率).{0,8}(?:高|低|多|少|满|吗|呢|多少|%|百分比|百分之\\d+)?"
          # 查看 CPU/内存本身也走本地只读直通，避免“查看cpu/查看内存”被云端拦截。
          - "^(?:查看|查|看|显示|看看)(?:一下|下)?(?:当前|现在)?(?:CPU|cpu|处理器)(?:信息|状态|情况|型号|核心|核数|占用|使用|使用率|占用率)?$"
          - "^(?:查看|查|看|显示|看看)(?:一下|下)?(?:当前|现在)?(?:内存|RAM|ram)(?:信息|状态|情况|占用|使用|使用率|占用率)?$"
          - "^(?:[Ss]how|[Vv]iew|[Cc]heck|[Dd]isplay|[Gg]et)\\s+(?:the\\s+)?(?:CPU|cpu|[Pp]rocessor)(?:\\s+(?:info|status|usage|load))?$"
          - "^(?:[Ss]how|[Vv]iew|[Cc]heck|[Dd]isplay|[Gg]et)\\s+(?:the\\s+)?(?:[Mm]emory|RAM|ram)(?:\\s+(?:info|status|usage|load))?$"
        keywords: ["CPU使用", "温度", "系统状态", "系统信息", "整机状态"]
        # 裸词「温度」需与查询/系统语境同现，防止「温度过高」这类陈述句
        # 注入只读查询候选。
        require_object: ["系统", "状态", "信息", "整机", "CPU", "cpu", "使用", "占用", "内存", "磁盘", "查看", "查", "看", "显示", "多少", "几度", "吗", "呢"]
        slot_map:
