      cmd: "wpctl set-default {device_id}"

  audio_input_volume:
    display: "调节输入音量"
    display_en: "Set the microphone/recording input volume level (0-100). Use when the user asks to change the microphone or recording volume. For system output volume use set_volume; for muting the microphone use audio_input_mute."
    short: "mic_vol"
    aliases: ["input_volume", "mic", "microphone", "麦克风音量", "录音音量", "输入音量"]
    params:
      level: {type: int, range: [0, 100], default: 80, unit: "%"}
      direction: {type: str, required: false, enum: [up, down]}
      amount: {type: int, required: false, default: 10, range: [1, 100], unit: "%"}
    routes:
      rule:
        patterns:
          - "(麦克风|话筒|输入|录音(?:设备)?).{0,6}(音量|声音).{0,6}(调|设|改)\\D{0,4}(?P<level>\\d+(?!成))"
          - "(调|设|改)\\D{0,4}(麦克风|话筒|输入|录音(?:设备)?).{0,4}(音量|声音)\\D{0,4}(?P<level>\\d+(?!成))"
          # 支持"调大麦克风声音"、"把录音音量开大一点"等无数字的相对调整
          - "(调大|提高|开大|增大|放大).{0,4}(麦克风|话筒|输入|录音(?:设备)?).{0,4}(音量|声音|音频)?"
          - "(麦克风|话筒|输入|录音(?:设备)?).{0,4}(音量|声音).{0,4}(调大|提高|开大|增大|放大)"
          - "^set\\s+(?:microphone|mic)\\s+volume\\s+to\\s+(?P<level>\\d+)$"
          - "^(?:increase|turn\\s+up|raise)\\s+(?:the\\s+)?(?:microphone|mic|recording)\\s+volume$"
          - "^input\\s+volume\\s+is\\s+too\\s+low$"
        keywords: ["麦克风", "话筒", "输入音量", "录音音量", "录音设备", "microphone", "mic", "input"]
        slot_map:
          开大: {direction: up, amount: 10}
          调大: {direction: up, amount: 10}
          大一点: {direction: up, amount: 10}
          提高: {direction: up, amount: 10}
          调小: {direction: down, amount: 10}
          小一点: {level: 20}
          降低: {direction: down, amount: 10}
          最大: {level: 100}
          最小: {level: 0}
      local: "mic_vol(level:0-100)"
    system:
      type: pipewire
      cmd: "wpctl set-volume @DEFAULT_AUDIO_SOURCE@ {level}%"

  audio_input_switch:
    display: "切换音频输入设备"
    display_en: "Switch the audio input device (built-in microphone, headset). Use when the user asks to change which microphone/recording device is used. For switching the output device use audio_output_switch."
    short: "audio_in"
    aliases: ["input", "source", "输入设备", "麦克风", "话筒"]
    params:
      device: {type: str, enum: [builtin, headset, auto], default: auto}
    routes:
      rule:
        patterns:
          - "(切换|换|改为|更改|改|设)(?:到|成|为)?.{0,4}(内置|板载|主板).{0,4}(麦克风|话筒|输入|录音(?:设备)?)"
          - "(切换|换|改为|更改|改|设)(?:到|成|为)?.{0,4}(耳机|外接).{0,4}(麦克风|话筒|输入|录音(?:设备)?)"
          - "(麦克风|话筒|输入|录音(?:设备)?).{0,4}(切换|换|改)"
          # 支持"录音设备换成板载的"等表述
          - "(录音(?:设备)?).{0,4}(换成|改成|切成|设成).{0,4}(内置|板载|主板|耳机|外接)"
          - "^(?:switch|change)\\s+to\\s+(?:built-in|internal|onboard)\\s+(?:microphone|mic)$"
          - "^(?:use|change\\s+to)\\s+(?:the\\s+)?(?:headset|headphone)\\s+mic$"
          - "^switch\\s+microphone$"
          - "^use\\s+the\\s+laptop'?s\\s+built-in\\s+mic$"
        keywords: ["输入设备", "麦克风", "话筒", "切换输入", "录音设备", "microphone", "mic", "input", "switch"]
        slot_map:
