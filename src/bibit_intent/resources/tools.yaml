  close_app:
    display: "关闭应用"
    display_en: "Close a running application by its display name, desktop ID, or common alias."
    description_en: "Close a running GUI application. The process is resolved through the shared alias table and .desktop Exec entries, then terminated with pkill. If nothing is running, suggest similar installed applications when available; otherwise report that the app was not found."
    short: "close"
    aliases: ["close", "quit", "stop", "exit", "kill", "close app", "关闭", "退出", "停止", "结束"]
    params:
      app_name: {type: str}
    routes:
      rule:
        # 负向前瞻与 launch_app 完全对称：硬件/系统功能词交给对应 skill
        #（相机/麦克风/蓝牙等），窗口语义词交给 window_* 或上云，进程归本工具。
        patterns:
          # 排除硬件关键词 + 排除"XX服务"（交给 service_stop）+ 排除窗口语义词
          - "^(?:帮我)?(?:关闭|退出|停止|结束)\\s*(?!一下|那个|这个|正在|现在|一会儿|在跑的|蓝牙(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|WiFi(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|wifi(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|WIFI(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|wi-fi|Wi-Fi|无线(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|摄像头(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|相机(?!设置|管理器|面板|中心|应用|程序|软件|控制|助手)|麦克风|话筒|扬声器|喇叭|耳机|有线|以太网|网卡|省电|低功耗|高性能|性能模式|CPU|Boost|加速|超频|静音|飞行|nat|NAT|ip转发|IP转发|端口转发|进程(?![一-龥])|防火墙(?![一-龥])|自动更新(?![一-龥])|录音(?![一-龥])|定位(?![一-龥])|脚本(?![一-龥])|日志(?![一-龥])|备份(?![一-龥])|同步(?![一-龥])|代理(?![一-龥])|多久|多长时间|时间|上限|限制|(?:的)?文件(?!管理器|管理|系统|夹)|窗口|窗口列表|应用列表|所有窗口)(?P<app_name>[a-zA-Z0-9\\-_一-龥]+?)(?<!服务)$"
          - "^(?:please\\s+)?(?:close|quit|exit|stop|kill)\\s+(?:the\\s+)?(?!benchmark$|script$|tests?$|backups?$|updates?$|upgrades?$|diagnostic(?:s)?$|commands?$|tasks?$|jobs?$|services?$|process(?:es)?$|logs?$|syncs?$|prox(?:y|ies)$|firewall$|recording$|location$|bluetooth$|wi-?fi$|camera$|microphones?$|mics?$|speakers?$|headphones?$|ethernet$|nic$|music$|videos?$|audios?$|songs?$|movies?$|playlists?$|files?$|documents?$|folders?$|director(?:y|ies)$|windows?$|lids?$|doors?$|box(?:es)?$|books?$|pages?$|tabs?$|curtains?$|drawers?$|cabinets?$|blinds?$|deals?$)(?P<app_name>[a-zA-Z0-9_-]+)$"
          # 英文多词：要求 app/application 后缀，与 launch_app 的英文多词规则对称
          - "^(?:please\\s+)?(?:close|quit|exit|stop|kill)\\s+(?:the\\s+)?(?P<app_name>[a-zA-Z0-9][a-zA-Z0-9 _-]{0,30}?)(?:\\s+app|\\s+application)$"
        keywords: ["关闭", "退出", "停止", "结束", "应用", "程序"]
      local: "close(app:...)"
    system:
      type: app_control
      handler: "close"
      # 与 launch_app.system.aliases 共用同一张别名表（YAML 锚点），
