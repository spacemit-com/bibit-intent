      local: "audio_in(device:builtin|headset|auto)"
    system:
      type: pipewire
      cmd: "wpctl set-default {device_id}"

  audio_input_mute:
    display: "输入设备静音/取消静音"
    display_en: "Mute or unmute the microphone/input device. Use when the user asks to mute the microphone or stop the mic from picking up sound. For muting the system output sound use mute."
    short: "mic_mute"
    aliases: ["input_mute", "麦克风静音", "话筒静音"]
    params:
      "on": {type: bool, default: true}
    routes:
      rule:
        patterns:
          - "^(?:把|将)?(麦克风|话筒|输入|录音(?:设备)?).{0,4}(静音|消音|关闭|禁用|不要发声)(?:一下|吧)?$"
          - "^(?:把|将)?(打开|开启|启用).{0,4}(麦克风|话筒|输入|录音(?:设备)?)(?:一下|吧)?$"
          - "^(?:把|将)?(取消|关闭).{0,4}(麦克风|话筒|输入|录音(?:设备)?).{0,4}(静音|消音)(?:一下|吧)?$"
          - "^mute\\s+(?:the\\s+)?(?:microphone|mic)$"
          - "^(?:turn\\s+off|disable)\\s+(?:the\\s+)?(?:microphone|mic)$"
          - "^(?:unmute|turn\\s+on|enable)\\s+(?:the\\s+)?(?:microphone|mic)$"
          - "^mute\\s+my\\s+mic\\s+during\\s+the\\s+meeting$"
        keywords: ["麦克风静音", "话筒静音", "输入静音", "录音设备", "mute", "microphone", "mic"]
        slot_map:
