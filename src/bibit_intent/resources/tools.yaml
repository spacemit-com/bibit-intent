  file_search:
    display: "本地搜索文件"
    display_en: "Search for files locally on the device by name or content. Use when the user asks to find, locate, or search for a file or document on this machine."
    short: "fs"
    params:
      query: {type: str}
    routes:
      rule:
        # 补充前置层 _LOCAL_SEARCH_RE 漏掉的口语：方位词与检索动词之间隔了
        # 礼貌/修饰词（"电脑上帮我找一下"），前置层要求紧邻故漏网。
        # 方位词沿用带后缀精确集，避免裸"电脑"误吃"查一下电脑的IP地址"；
        # 对象不限：媒体文件（照片/视频/音乐）不在 _FILE_OR_MEDIA_TRAP_RE 的
        # 文档名词表内，正好由规则引擎补上本地搜索。
        # query 不设命名捕获组，命中后由 router 整句透传（与前置层直通一致）。
        patterns:
          - "(?:本地|本机|电脑上|电脑里|我电脑)[^。！？!?\\n]{0,8}(?:搜索|查找|找一下|找找|(?<![检核审复排清])查一下|(?<![检核审复排清])查查|检索|搜|看看|翻一下)"
          - "(?:搜索|查找|找一下|找找|(?<![检核审复排清])查一下|(?<![检核审复排清])查查|检索|搜)[^。！？!?\\n]{0,6}(?:本地|本机|电脑上|电脑里|我电脑)"
        keywords: ["本地搜索", "本地查找", "搜索本地", "本机搜索", "电脑上找"]
      local: "fs(query:...)"
    system:
      type: filesearch
      mcp:
        group: readonly

  open_file:
