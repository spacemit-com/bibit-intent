    short: "opendir"
    aliases: ["open folder", "open directory", "打开文件夹", "打开目录", "打开位置"]
    params:
      path: {type: str}
      location: {type: str, required: false, hint: "可选位置限定词，如 桌面/文档/下载；给出时在该位置目录内定位名称。"}
    routes:
      rule: null
      local: null
    system:
      type: file_open
      handler: open_folder
      mcp:
        group: control

  # ── 有线网络（ethernet）────────────────────────────────────────────
  # 不需要独立 skill，直接用 nmcli/ip 命令内联实现。
  # iface 默认 eth0，实际环境可能是 enp3s0/eth1 等，执行层按需替换。

  eth_up:
    display: "启用有线网卡"
    display_en: "Enable the wired (Ethernet) network interface. Use when the user asks to turn on, enable, or reconnect the wired or Ethernet connection."
    short: "ethup"
    # 别名只留名词式：动作式别名会喂 core_control_cues()，触发核心工具兜底注入。
    aliases: ["eth_up", "有线连接"]
    params: {}
    routes:
      rule:
        # 动词必须二级（开启/打开/启用/启动/恢复/接入，不用单字"开"）+ 宾语白名单 + 句尾锚定，
        # 否则"开有线电视"会去开网卡。
        patterns:
          - "(?:开启|打开|启用|启动|恢复|接入)\\s*(?:一下)?\\s*(?:有线网络|有线网卡|有线网|有线|以太网卡|以太网|网卡|ethernet|eth)\\s*(?:连接|网络)?\\s*[。！!]?$"
          - "把\\s*(?:有线网络|有线网卡|有线网|以太网|网卡)\\s*(?:打开|开起来|开启|跑起来|连上)"
        # 关键词只收"动词+宾语"短语，不收"有线网络/以太网/网卡"这类裸名词
        # （否则 IP、类型、历史类提问都会被注入本工具）。
        keywords: ["开有线网", "开有线网络", "启用有线网", "打开有线", "开启有线", "恢复有线", "连上有线", "网卡跑起来"]
        # §4.4-C 候选注入护栏：本工具有副作用（nmcli device connect）。
        # 弱命中必须句中出现有线/以太网/网卡直接宾语才生效（当前关键词均已自带宾语，
        # 属防御性声明）。
        require_object: ["有线", "以太网", "网卡", "ethernet", "eth"]
      local: "ethup()"
    system:
      # 实际网卡名由 tools/system.py:eth_up 探测（end0/enp3s0/eth0 等各异），
      # 此处仅作声明；执行走 HANDLERS["eth_up"]。
      type: shell
      cmd: "nmcli device connect <自动探测的有线网卡>"

  eth_down:
    display: "禁用有线网卡"
    display_en: "Disable the wired (Ethernet) network interface. Use when the user asks to turn off, disconnect, or stop the wired or Ethernet connection."
    short: "ethdown"
    # 别名只留名词式：动作式/裸名词别名会喂 core_control_cues()，触发核心工具兜底注入。
    aliases: ["eth_down", "有线断开"]
    params: {}
    routes:
      rule:
        # 宾语白名单 + 句尾锚定，p1 为「把 + 白名单宾语 + 动作」，
        # 否则"关掉有线电视"会禁掉网卡。
        patterns:
          - "(?:关闭|禁用|断开|切断|停止|停掉|关掉)\\s*(?:一下)?\\s*(?:有线网络|有线网卡|有线网|有线|以太网卡|以太网|网卡|ethernet|eth)\\s*(?:连接|网络)?\\s*[。！!]?$"
          - "把\\s*(?:有线网络|有线网卡|有线网|以太网|网卡)\\s*(?:关了|关掉|关闭|停了|停掉|断开|切断|禁用)"
        keywords: ["禁用有线", "关有线", "断有线", "关闭有线", "关以太网"]
        # §4.4-C 候选注入护栏：本工具有副作用（nmcli device disconnect，会切断 SSH）。
        # 弱命中必须句中出现有线/以太网直接宾语才生效（防御性声明，同 eth_up）。
        require_object: ["有线", "以太网", "网卡", "ethernet", "eth"]
      local: "ethdown()"
    system:
      # 同 eth_up：网卡名探测得来。eth_down 另有自保护——拒绝断开正承载
      # 当前 SSH 会话的网卡。
      type: shell
      cmd: "nmcli device disconnect <自动探测的有线网卡>"

  eth_status:
    display: "查看有线网络状态"
    display_en: "Show the wired (Ethernet) connection status and whether a cable is plugged in. Use when the user asks if the wired or Ethernet connection is up, connected, or working."
    short: "ethstat"
    aliases: ["eth_status", "有线状态", "网线状态", "网卡状态"]
    params: {}
    routes:
      rule:
        patterns:
          - "^(?:show|check|display|get)\\s+(?:the\\s+)?(?i:ethernet)\\s+(?:connection\\s+)?status$"
          - "^(?:is\\s+)?(?:the\\s+)?(?i:ethernet)\\s+(?:connection\\s+)?(?:up|down|connected|active)\\??$"
          # 备选词「长词在前」（IP地址 在 IP 之前）+ 宾语白名单：confidence 取决于匹配跨度
          # 是否等于整句，短词在前只能吃到"连接"，会被 net_conn 的整句命中抢走。
          - "(?:查看|查询|检查|看看|看|显示)\\s*(?:一下)?\\s*(?:有线网络|有线网卡|有线网|以太网|网卡|网线)\\s*(?:的)?\\s*(?:连接状态|是不是好的?|好了没|通不通|状态|连接)(?!.*(?:IP|ip|地址|内网))"
          - "(?:有线网卡|有线网|网线|网卡|以太网)\\s*(?:插上了吗|连上了没|接好了吗|有没有接好|正常吗|通吗|通不通|好了没|是不是好的?|坏了吗)"
        # 关键词只留带动作或疑问的短语："网卡状态"这类纯名词会喂 core_control_cues()。
        keywords: ["有线状态", "网线连接", "网线插上", "网卡是不是好的"]
      local: "ethstat()"
    system:
      # 实现用 `nmcli -t -f DEVICE,TYPE,STATE,CONNECTION device status`
      # 加读 /sys/class/net/<夹>/carrier 判断网线是否插着。
      type: shell
      cmd: "nmcli -t -f DEVICE,TYPE,STATE,CONNECTION device status"
      mcp:
        group: readonly

  eth_ip:
    display: "查看有线网络 IP"
    display_en: "Show the wired (Ethernet) interface's IP address. Use only when the user explicitly says wired or Ethernet. For a generic IP query use net_ip; for wireless use wifi_ip; for the public IP use net_ext_ip."
    short: "ethip"
    aliases: ["eth_ip", "有线ip", "以太网ip", "网卡ip"]
    params: {}
    routes:
      rule:
        # 只吃显式含"有线/以太网"的 IP 查询：通用"当前IP"归 net_ip、"网卡地址"归 net_mac、
        # 含"无线/wifi"归 wifi_ip；宾语白名单 + 长词在前（IP地址 在 IP 之前）。
        patterns:
          - "(?:查看|查询|获取|看|帮我查)\\s*(?:一下|下)?\\s*(?:有线网络|有线网卡|有线网|以太网卡|以太网)\\s*(?:的)?\\s*(?:内网|局域网)?\\s*(?:IP地址|ip地址|网络地址|IP|ip|地址)(?!.*(?:MAC|mac|物理))"
          - "(?:有线网络|有线网卡|有线网|以太网卡|以太网)\\s*(?:的)?\\s*(?:内网|局域网)?\\s*(?:IP地址|ip地址|内网地址|IP|ip|地址)(?:是多少|是啥|是什么)?(?!.*(?:MAC|mac|物理))"
          - "(?:有线网络|有线网|以太网)\\s*(?:分配的|分配)\\s*(?:地址|IP|ip)(?:是什么|是多少|是啥)?"
        # 关键词只留显式含"有线/以太网"的短语。
        keywords: ["有线ip", "以太网ip", "有线IP地址", "以太网IP"]
      local: "ethip()"
    system:
      # 实现用 `nmcli -t -f IP4.ADDRESS,IP4.GATEWAY device show <夹>`。
      type: shell
      cmd: "nmcli -t -f IP4.ADDRESS,IP4.GATEWAY device show <自动探测的有线网卡>"
      mcp:
        group: readonly
