# Ubuntu 命令技巧 Skill
# 依据 wiki.ubuntu.org.cn/UbuntuSkills 提炼的常用只读运维命令：
#   安装升级(dpkg/apt) / 系统(uname/lsb_release/lspci/lsusb/uptime)
#   硬盘(df/du/lsblk) / 进程(ps/top/pstree)
#   网络(ip addr/ss) / 服务(systemctl) / 用户(last/w)
# 全部为只读查询，无破坏性操作；参数化 subprocess，杜绝 shell 注入。
# 对照 design.md §5.3（端侧 Skill 简化）

name: ubuntu_cmd
version: "1.0"
display: "Ubuntu 命令查询"
description: "软件包/系统/磁盘/进程/网络/服务/用户等 Ubuntu 命令查询"
author: "bibit"

# Skill 依赖的系统命令（缺失只标记，执行时才报错）
requires:
  - dpkg
  - apt-cache
  - ps
  - lastlog2
  - iostat
  - hdparm
  - lshw
  - clamscan
  - enca
  - whois
  - tracepath

# Skill 提供的工具
tools:

  software_delivery_assess:
    display: "评估软件交付路径（RISC-V只读）"
    display_en: "Assess software delivery routes (RISC-V read-only)"
    short: "softwareassess"
    aliases: ["软件交付评估", "RISC-V软件评估", "评估软件安装"]
    params:
      target: {type: str}
      version: {type: str, default: ""}
      scope: {type: str, default: ""}
    routes:
      rule:
        patterns:
          - "^软件交付评估\\s+(?P<target>[a-z0-9][a-z0-9+.-]*(?::[a-z0-9][a-z0-9-]*)?)$"
          - "^评估(?:安装)?软件\\s+(?P<target>[a-z0-9][a-z0-9+.-]*(?::[a-z0-9][a-z0-9-]*)?)$"
          - "^(?:assess|check)\\s+software\\s+delivery\\s+(?P<target>[a-z0-9][a-z0-9+.-]*(?::[a-z0-9][a-z0-9-]*)?)$"
        keywords: ["软件交付评估", "RISC-V软件评估", "software delivery"]
    local: null
    confirm: false
    handler: "software_delivery_assess"
    mcp: {group: readonly}

  pkg_candidate:
    display: "查询单包候选版本与架构（只读）"
    params:
      pkg: {type: str}
    routes:
      rule:
        patterns:
          - "^软件包候选\\s+(?P<pkg>\\S+)$"
        keywords: ["软件包候选"]
      local: null
    confirm: false
    handler: "pkg_candidate"
    mcp: {group: readonly}

  pkg_operation_preview:
    display: "单包安装卸载影响预检（只读模拟，不执行）"
    params:
      operation: {type: str, enum: [install, remove]}
      pkg: {type: str}
    routes:
      rule:
        patterns:
          - "^软件包预检\\s+(?P<operation>install|remove)\\s+(?P<pkg>\\S+)$"
        keywords: ["软件包预检"]
        slot_map:
          安装: {operation: install}
          卸载: {operation: remove}
      local: null
    confirm: false
    handler: "pkg_operation_preview"
    mcp: {group: readonly}

  pkg_verify:
    display: "核验软件包安装状态与目标版本（只读，不启动应用）"
    params:
      pkg: {type: str}
      expected_version: {type: str, default: ""}
      executable: {type: str, default: ""}
    routes:
      rule:
        patterns:
          - "^软件包验证\\s+(?P<pkg>\\S+)(?:\\s+(?P<expected_version>\\S+))?$"
        keywords: ["软件包验证"]
      local: null
    confirm: false
    handler: "pkg_verify"
    mcp: {group: readonly}

  pkg_match_preview:
    display: "软件包模式只读预览"
    display_en: "Preview package names only; explicit glob/regex full-name matching. available uses cached APT names, not guaranteed installable; installed includes incomplete packages. Never installs or removes."
    short: "pkgpreview"
    params:
      scope: {type: str, enum: [available, installed]}
      mode: {type: str, enum: [glob, regex]}
      pattern: {type: str}
      limit: {type: int, range: [1, 50], default: 20}
    routes:
      rule:
        patterns:
          - "^(?:软件包预览|包预览|package preview)\\s+(?P<scope>available|installed)\\s+(?P<mode>glob|regex)\\s+(?P<pattern>.+)$"
        keywords: ["软件包预览", "包预览", "package preview"]
        slot_map:
          软件源: {scope: available}
          已安装: {scope: installed}
          通配符: {mode: glob}
          正则: {mode: regex}
      local: null
    confirm: false
    handler: "pkg_match_preview"
    mcp:
      group: readonly

  # ── 软件包管理（wiki 安装升级 节）──────────────────────────────────
  pkg_files:
    display: "查看软件包安装了哪些文件"
    display_en: "List files installed by a package (dpkg -L)"
    short: "pfiles"
    aliases: ["pkgfiles", "package-files", "安装内容", "装了哪些文件"]
    params:
      pkg: {type: str}
    routes:
      rule:
        patterns:
          - "(?:查看|看看|查|看|显示|列出).{0,6}(?:软件|包|程序).{0,6}?(?P<pkg>[a-zA-Z0-9_+.-]{1,40}).{0,4}(?:安装|装了)(?:哪些|什么|些什么)?(?:的)?(?:文件|内容)"
          - "(?P<pkg>[a-zA-Z0-9_+.-]{1,40})(?:这个)?(?:软件|包|程序)?(?:安装了|装了|安装).{0,3}(?:哪些|什么|些什么)?(?:文件|内容)"
          # 口语“看看…装了什么/装了些啥”对象不明确（装的什么内容/放哪），
          # 一律升级云端，不直通 pkg_files（见 corpus U03）
          - "(?P<pkg>[a-zA-Z0-9_+.-]{1,40})(?:这个)?(?:软件|包|程序)(?:都|就|也)?(?:装了|安装了)(?:哪些|什么|些什么)(?:内容|文件)?"
          - "(?P<pkg>[a-zA-Z0-9_+.-]{1,40})(?:这个)?(?:软件|包|程序)?.{0,6}(?:文件清单|文件列表)"
          - "^(?:please\\s+)?(?:show|list|display)\\s+(?:the\\s+)?(?:package\\s+)?files\\s+(?:for|of)\\s+(?P<pkg>[a-zA-Z0-9_+.-]{1,40})$"
        keywords: ["安装内容", "装了哪些文件", "安装了哪些文件", "装了什么", "装了哪些内容", "安装的文件", "dpkg -L", "文件清单", "文件列表"]
      local: "pfiles(pkg:...)"
    handler: "pkg_files"

  pkg_search:
    display: "搜索软件库中的软件"
    display_en: "Search packages in apt repositories (apt-cache search). Only for OS software packages. Not for network routes (net_trace), domain whois (net_whois), IP addresses (net_ip), or firewall rules (iptables_list)."
    short: "psearch"
    aliases: ["aptsearch", "search-pkg", "搜软件", "软件搜索"]
    params:
      query: {type: str}
    routes:
      rule:
        # 负向前瞻：紧跟"搜索/查找"的若是硬件设备关键词（蓝牙/WiFi/USB/摄像头等），
        # 交给对应硬件 skill（bluetooth: bt_scan / wifi: wifi_scan / ...），
        # 避免"搜一下附近的蓝牙设备"被误当成搜包。
        patterns:
          - "(?:帮我)?(?:搜索|搜一?下|查找|找找)(?!.{0,10}(?:蓝牙|WiFi|wifi|WIFI|无线|网络|USB|usb|PCIe|pcie|摄像头|相机|外设|附近))(?!.{0,20}(?:资讯|新闻|网页|报告|文章|资料|教程|生成|可视化|搜索引擎|百度|谷歌|全网|AI资讯|AI新闻|在干什么|在干嘛|干什么|干嘛|是谁|是什么|怎么样|天气)).{0,4}?(?:软件|软件库|仓库|软件源|apt)?(?P<query>.{1,20})$"
          - "(?:想知道|我想知道).{0,4}(?:apt|软件|软件库|仓库|源).{0,4}(?:里|中|内).{0,3}(?:有没有|是否有|是否).{0,3}?(?P<query>[a-zA-Z0-9_+.-]{1,40})$"
          - "(?:apt|软件库|软件源).{0,4}(?:里|中).{0,4}(?:能|可以)?(?:搜到|找到|查到).{0,3}?(?P<query>[a-zA-Z0-9_+.-]{1,40})"
          # 口语直通：仓库里到底有没有 tree 这个包，规则层定死，绕开 1B 选 usb_tree。
          - "(?:仓库|软件库|软件源|源).{0,4}(?:里|中|内).{0,4}(?:到底)?(?:有没有|是否有|找得到|搜得到|能搜到).{0,4}?(?P<query>[a-zA-Z0-9_+.-]{1,40}).{0,4}?(?:这个)?(?:包|软件|程序)"
        keywords: ["仓库里有没有", "软件库有没有", "搜一下", "搜索软件", "找找", "软件库", "apt search", "软件源", "搜到", "能搜到", "仓库", "仓库里"]
      local: "psearch(query:...)"
    handler: "pkg_search"

  pkg_info:
    display: "查看软件包信息"
    display_en: "Show package metadata from apt repositories (apt-cache show)"
    short: "pinfo"
    aliases: ["pkginfo", "pkg-info", "包信息", "软件信息"]
    params:
      pkg: {type: str}
    routes:
      rule:
        patterns:
          - "^(?:查看|看看|查|看|显示)\\s*软件包\\s*(?P<pkg>[a-zA-Z0-9_+.-]{1,40})\\s*(?:的\\s*)?(?:信息|详情|介绍|版本)$"
          - "(?!.{0,4}(?:CPU|cpu)(?:信息|详情))(?:查看|看看|查|看|显示).{0,4}?(?:软件|包|程序)?(?P<pkg>[a-zA-Z0-9_+.-]{1,40})(?:这个)?(?:软件|包)?(?:的)?(?:信息|详情|介绍|版本)"
          - "(?P<pkg>[a-zA-Z0-9_+.-]{1,40}).{0,3}(?:装的是|是什么版本|的版本|包的信息)"
          - "^(?:please\\s+)?(?:show|display|get)\\s+(?:the\\s+)?(?:package|software)\\s+information\\s+(?:for|about|of)\\s+(?P<pkg>[a-zA-Z0-9_+.-]{1,40})$"
          - "^(?:please\\s+)?(?:show|display|get)\\s+(?:the\\s+)?(?:package|software)?\\s*(?:info|information|details)\\s+(?:for|about|of)\\s+(?P<pkg>[a-zA-Z0-9_+.-]{1,40})$"
        keywords: ["包的信息", "软件信息", "版本信息", "包的详情", "装的是什么", "什么版本", "有没有装", "装过"]
      local: "pinfo(pkg:...)"
    handler: "pkg_info"

  pkg_installed:
    display: "查看已安装的软件包列表"
    display_en: "List installed packages with optional name filter (dpkg-query -W). Only for OS software packages. Not for firewall rules (iptables_list), network routes (net_trace), or IP addresses (net_ip)."
    short: "pinstalled"
    aliases: ["installed", "dpkgl", "已安装", "软件列表"]
    params:
      filter: {type: str, default: ""}
    routes:
      rule:
        patterns:
          - "^(?:show|list|display)\\s+(?:all\\s+)?installed\\s+(?:packages|software)$"
          - "(?:查看|看看|查|看|显示|列出).{0,4}(?:系统|已经|已).{0,4}(?:安装|装了).{0,4}(?:的)?(?:软件|软件包|包)(?:列表|清单)?"
          - "^(?:装了|安装|已装).{0,3}(?:哪些|什么).{0,3}(?:软件|包|程序)$"
          - "^(?:系统|设备|机器)(?:里|上)?有没有装(?P<filter>[a-zA-Z0-9_+.-]{1,40})$"
        keywords: ["有没有装", "已安装的包", "安装了哪些", "软件列表", "安装的软件", "装了哪些软件"]
      local: "pinstalled(filter:...)"
    handler: "pkg_installed"

  pkg_owns_file:
    display: "查找文件属于哪个软件包"
    display_en: "Find which package owns a file (dpkg -S)"
    short: "powns"
    aliases: ["owns", "pkg-owns", "文件归属", "哪个包"]
    params:
      file: {type: str}
    routes:
      rule:
        patterns:
          - "(?:查|看|找|找找|确认).{0,4}?(?:这个|下|一下)?(?P<file>[a-zA-Z0-9_/.-]{1,60})(?:这个文件)?(?:属于|来自|是谁装的|是哪个包装的).{0,2}(?:哪个|什么)(?:软件|包)?"
          - "(?P<file>[a-zA-Z0-9_/.-]{1,60})(?:这个文件)?(?:属于|来自).{0,2}(?:哪个|什么)(?:软件包|软件|包)"
          # 口语直通：top这个命令是哪个包带的，规则层定死，绕开 1B 选 close_app。
          - "(?P<file>[a-zA-Z0-9_/.-]{1,60}).{0,8}(?:哪个包带的|哪个包装的|哪个软件包带的)"
          - "^(?:please\\s+)?(?:which|what)\\s+package\\s+(?:owns|provides|contains)\\s+(?P<file>/[a-zA-Z0-9_/.-]+)$"
        keywords: ["属于哪个包", "哪个软件包", "属于哪个软件", "来自哪个包", "dpkg -S", "哪个包装的", "哪个包"]
      local: "powns(file:...)"
    handler: "pkg_owns_file"

  pkg_depends:
    display: "查询软件包依赖哪些包"
    display_en: "Show dependencies of a package (apt-cache depends)"
    short: "pdep"
    aliases: ["depends", "pkg-depends", "依赖", "依赖关系"]
    params:
      pkg: {type: str}
    routes:
      rule:
        patterns:
          # 依赖查询必须带疑问词或"的+包/软件/库"名词；禁止"X需要…"裸动词句式
          # 误伤叙述句（如"agent os需要全部功能集成进来"会被旧的宽松正则当成
          # 包依赖查询，抽到 pkg=agent 后 apt-cache depends 报 码100）。
          - "(?P<pkg>[a-zA-Z0-9_+.-]{1,40})\\s{0,3}依赖(?:(?:哪些|什么|那些|多少)(?:的)?(?:软件|包|库|依赖)?|的(?:依赖包|依赖|软件包|软件|包|库))"
          - "(?:查|看|查看).{0,4}?(?P<pkg>[a-zA-Z0-9_+.-]{1,40}).{0,3}依赖"
          - "(?:查|看|查看).{0,6}?(?P<pkg>[a-zA-Z0-9_+.-]{1,40}).{0,6}(?:要|需要|得).{0,4}(?:拉|装|下载).{0,4}(?:哪些|什么).{0,2}(?:依赖|包)"
          # 口语直通：python3 装了哪些依赖包，规则层定死，绕开 1B 选 eth_down。
          - "(?P<pkg>[a-zA-Z0-9_+.-]{1,40}).{0,6}?(?:装|安装|拉|下载).{0,4}(?:了)?(?:哪些|什么|多少).{0,4}(?:依赖|依赖包)"
          # X 需要/要/依靠…哪些/什么 +（依赖|包|软件|库）…：疑问词与名词尾缀
          # 都必现，防止"X需要做…/X需要把…集成"等陈述句触发依赖查询。
          - "(?P<pkg>[a-zA-Z0-9_+.-]{1,40})\\s{0,3}(?:需要|要|依靠).{0,6}?(?:哪些|什么|那些|多少)(?:的)?(?:依赖包|依赖|软件包|软件|包|库|前置)"
          # 安装 X（前|之前|以前）需要装什么/哪些（依赖|包|软件|库）
          - "(?P<pkg>[a-zA-Z0-9_+.-]{1,40}).{0,8}(?:前|之前|以前).{0,4}(?:需要|要|需).{0,4}(?:装|拉|下载).{0,4}(?:什么|哪些|多少)(?:依赖|包|软件|库|前置)?"
        keywords: ["要拉哪些依赖", "依赖哪些", "依赖什么", "需要哪些包", "依赖的包", "哪些依赖", "apt-cache depends", "依赖包"]
      local: "pdep(pkg:...)"
    handler: "pkg_depends"

  pkg_rdepends:
    display: "查询软件包被哪些包依赖"
    display_en: "Show reverse dependencies of a package (apt-cache rdepends)"
    short: "prdep"
    aliases: ["rdepends", "reverse-depends", "反向依赖", "被谁依赖"]
    params:
      pkg: {type: str}
    routes:
      rule:
        patterns:
          - "(?P<pkg>[a-zA-Z0-9_+.-]{1,40}).{0,3}(?:被哪些|被什么|哪些包|哪些软件).{0,3}(?:依赖|引用|需要)"
          - "(?:谁|哪些).{0,3}(?:依赖|需要).{0,3}?(?P<pkg>[a-zA-Z0-9_+.-]{1,40})"
          - "^(?:有哪些|哪些|什么).{0,2}(?:软件|包|程序).{0,4}(?:在|正在)?(?:引用|依赖|需要).{0,3}?(?P<pkg>[a-zA-Z0-9_+.-]{1,40})$"
        keywords: ["被哪些包依赖", "被谁依赖", "反向依赖", "哪些包引用", "rdepends"]
      local: "prdep(pkg:...)"
    handler: "pkg_rdepends"

  # ── 系统信息（wiki 系统 节）────────────────────────────────────────
  sys_overview:
    display: "查看系统概览"
    display_en: "Show a combined system overview: OS/release version, kernel version, CPU model and cores, memory size, and uptime. Use when the user asks for several system facts in one request."
    short: "sysoverview"
    aliases: ["系统概览", "整机信息", "系统概况", "system overview"]
    covers: []
    params: {}
    routes:
      rule:
        patterns: []
        keywords: ["系统概览", "整机信息", "系统概况", "system overview"]
      local: null
    confirm: false
    handler: "sys_overview"
    mcp: {group: readonly}

  sys_kernel:
    display: "查看内核版本"
    display_en: "Show the kernel version. Use when the user asks about the kernel version or what kernel is running. For OS/release version use sys_version."
    short: "kernel"
    aliases: ["uname", "内核", "kernel版本"]
    covers: ["内核版本", "内核", "kernel"]
    params: {}
    routes:
      rule:
        patterns:
          - "(?:查看|查|看|显示|告诉我).{0,4}(?:系统|当前)?(?:内核|kernel|Kernel).{0,4}(?:版本|信息)"
          - "^(?:内核|kernel)版本$"
          - "(?:这台|本机|当前)?(?:机器|设备|系统).{0,3}(?:kernel|Kernel|内核).{0,3}(?:是啥|是什么|多少|版本)"
        keywords: ["内核版本", "内核信息", "kernel版本", "kernel", "uname"]
      local: "kernel()"
    handler: "sys_kernel"
    mcp: {group: readonly}

  sys_version:
    display: "查看系统版本"
    display_en: "Show the OS/release version (e.g. Ubuntu version). Use when the user asks what OS version or distribution is running. For the kernel version use sys_kernel."
    short: "osver"
    aliases: ["os-version", "lsb-release", "系统版本", "发行版"]
    covers: ["系统版本", "发行版", "ubuntu版本", "os版本"]
    params: {}
    routes:
      rule:
        patterns:
          - "(?:查看|查|看|显示|告诉).{0,4}(?:系统|Ubuntu|linux|Linux|操作系统).{0,4}(?:版本|发行版)"
          - "系统是什么版本"
          - "(?:这台|本机).{0,3}(?:设备|机器).{0,4}(?:跑|运行|装).{0,3}(?:的)?(?:是)?什么系统"
          - "(?:ubuntu|Ubuntu)(?:是)?(?:什么)?版本"
        keywords: ["系统版本", "发行版", "ubuntu版本", "os版本", "系统信息", "什么系统"]
      local: "osver()"
    handler: "sys_version"

  sys_pci:
    display: "查看 PCI 设备"
    display_en: "List PCI devices (graphics card, etc.). Use when the user asks about PCI devices or the graphics card. For all hardware use sys_hw."
    short: "pci"
    aliases: ["lspci", "显卡", "pci设备"]
    covers: ["pci", "显卡", "pci设备"]
    params: {}
    routes:
      rule:
        patterns:
          - "(?:查看|查|看|显示|列出).{0,4}(?:PCI|pci|显卡).{0,4}(?:设备|列表)?"
        keywords: ["pci设备", "pci", "显卡设备", "lspci"]
      local: "pci()"
    handler: "sys_pci"

  # ── USB 三兄弟：树形 / 详情 / 重置 ──
  # 必须声明在 usb_list 之前：rule_engine._pattern_match 同置信度下按声明序
  # 取首个命中，特化工具在前可在正则平手时胜出（usb_list 另有负向前瞻兜底）。

  usb_tree:
    display: "显示 USB 设备树"
    display_en: "Show the USB device tree/topology (which device is connected to which hub or port). Use when the user asks about USB hierarchy, parent-child, or which device is plugged into where. For a flat list use usb_list; for verbose details use usb_detail."
    short: "usbtree"
    aliases: ["usb树", "usb拓扑", "usb层级", "usb结构"]
    params: {}
    routes:
      rule:
        patterns:
          - "(?:USB|usb).{0,6}(?:树状|树形|树|拓扑|层级|层次)"
          - "(?:查看|显示|列出|看).{0,4}(?:USB|usb).{0,6}(?:树状|树形|树|拓扑|层级|层次|结构)"
          - "(?:USB|usb).{0,4}(?:接口|设备)?.{0,4}(?:的)?(?:层级|拓扑|树状|树形)(?:结构|关系|连接|图)?"
          - "(?:USB|usb).{0,4}(?:Hub|hub|集线器).{0,6}(?:下面|下|连接|层级|接了|信息)"
          # 口语拓扑词直通：含 USB 的父子/上下级/挂在 语义，规则层定死，
          # 绕开 1B 在 usb_list 与 usb_tree 二选一时偏向通用项的毛病。
          - "(?:USB|usb).{0,10}(?:父子|上下级|谁挂在|挂在谁|谁下面|挂在哪)"
          # 口语拓扑直通：插/接在 A 还是 B（判断设备挂接位置/拓扑）
          - "(?:USB|usb).{0,12}(?:线|线缆|接口)?(?:插|接|挂)(?:在|着|的)?(?:了)?.{0,14}(?:还是|或者|或)"
        # 复合词 + 口语单词（层级/上下级/父子/挂在/扩展坞…）。单词不含 USB，
        # 靠 usb_list 让出裸词后才能被 _keyword_match 命中。
        keywords: ["USB树", "usb树", "USB拓扑", "usb拓扑", "USB层级", "usb层级",
                   "USB Hub", "usb hub", "集线器", "扩展坞", "上下级", "父子",
                   "层级", "层次", "拓扑", "树状", "树形", "挂在", "谁下面", "几层"]
        # §4.4-C 候选注入护栏：层级/拓扑/父子/挂在 等裸名词仅在 USB 语境下召回，
        # 防止「层级结构」「网络拓扑」「父子进程」误注入本工具。
        require_object: ["USB", "usb", "集线器", "Hub", "hub", "扩展坞"]
      local: "usbtree()"
    handler: "usb_tree"

  usb_detail:
    display: "显示 USB 设备详细信息"
    display_en: "Show detailed USB device info (vendor ID, serial number, descriptors, firmware, speed, current). Use when the user asks for USB device details or specific parameters. For a flat list use usb_list; for topology use usb_tree."
    short: "usbdetail"
    aliases: ["usb详情", "usb详细", "usb verbose"]
    params: {}
    routes:
      rule:
        patterns:
          - "(?:USB|usb).{0,6}(?:详细|详情|完整|具体).{0,4}(?:信息|参数|数据)?"
          - "(?:查看|显示|列出|看).{0,4}(?:USB|usb).{0,6}(?:设备|接口)?.{0,4}(?:的)?(?:详细|详情|完整|具体)"
          - "(?:USB|usb).{0,4}(?:verbose|详细模式)"
          - "(?:这个|那个|该).{0,4}(?:USB|usb).{0,6}(?:的)?(?:详细|详情|完整|具体).{0,4}(?:信息|参数)?"
          # 具体参数名口语直通：厂商编号/序列号/描述符/规格参数/固件版本 等，
          # 规则层定死，绕开 1B 在 usb_list 与 usb_detail 二选一时偏向通用项的毛病。
          - "(?:USB|usb).{0,10}(?:厂商编号|厂商号|序列号|描述符|固件版本|协议版本|规格参数)"
        # 加入具体参数名口语：厂商号/序列号/描述符/速率/电流/固件版本…
        keywords: ["USB详情", "usb详情", "USB详细", "usb详细", "USB完整", "USB具体",
                   "usb verbose", "厂商编号", "厂商号", "序列号", "描述符",
                   "固件版本", "协议版本", "规格参数", "速率", "电流"]
      local: "usbdetail()"
    handler: "usb_detail"

  usb_reset:
    display: "重置 USB 设备"
    display_en: "Reset or re-initialize a USB device. Use when a USB device (flash drive, mouse, keyboard) is unresponsive, frozen, or not detected. For listing devices use usb_list."
    short: "usbreset"
    aliases: ["usb重置", "usb刷新", "usb复位"]
    params:
      device: {type: str, default: ""}
    routes:
      rule:
        patterns:
          - "(?:重置|复位|刷新|重新加载|重新识别|重新初始化|重新插拔).{0,6}(?:USB|usb)(?:设备|接口|总线|口)?"
          - "(?:USB|usb).{0,6}(?:设备|接口|总线|口)?.{0,6}(?:重置|复位|刷新|重新加载|重新识别|重新初始化|重新认)"
          - "(?:USB|usb).{0,6}(?:设备|接口)?.{0,6}(?:失灵|卡死|没反应|识别不了|连不上|用不了)"
          - "(?:U盘|u盘|鼠标|键盘|外设).{0,6}(?:没反应|失灵|卡死|识别不了|连不上).{0,8}(?:重置|复位|刷新|重新)"
        # 故障/恢复口语（不好使/掉线/卡住/不拔线…）：与网络、系统症状表达重叠，
        # 必须受下面 require_object 护栏约束，否则会被注入 usb_reset（有物理副作用）。
        keywords: ["USB重置", "usb重置", "USB刷新", "usb刷新", "USB复位", "USB失灵",
                   "重置USB", "重置usb", "不好使", "掉线", "卡住", "不拔线",
                   "重新认", "重新初始化", "重新识别", "没反应", "不动了", "抽风"]
        # §4.4-C 候选注入护栏：句中没有 USB 直接宾语时，上述裸症状词不得注入本工具。
        # 覆盖全部正例（U019–U024 / H434–H439 均含 USB·U盘·外设 字面）。
        require_object: ["USB", "usb", "U盘", "u盘", "外设", "鼠标", "键盘"]
      local: "usbreset(device:optional)"
    handler: "usb_reset"

  usb_list:
    display: "查看 USB 设备"
    display_en: "List connected USB devices. Use when the user asks what USB devices are plugged in or connected. For topology use usb_tree; for detailed info use usb_detail; for resetting a frozen device use usb_reset."
    short: "usb"
    aliases: ["lsusb", "u盘", "usb设备", "外接设备", "usb列表", "usb接口"]
    covers: ["usb", "u盘", "外接设备", "usb设备"]
    params: {}
    routes:
      rule:
        # 负向前瞻：句中出现 树/拓扑/层级/详细/重置… 时让位给上面三个特化工具，
        # 否则 "显示USB设备树" 这类会被本工具的宽泛模式先吃掉。
        patterns:
          - "^(?:list|show|display)\\s+(?:all\\s+)?USB\\s+devices$"
          - "^(?:what\\s+)?USB\\s+devices(?:\\s+are)?(?:\\s+connected)?\\??$"
          - "(?!.*(?:树状|树形|树|拓扑|层级|层次|上下级|父子|集线器|扩展坞|详细|详情|完整|具体|verbose|描述符|规格|厂商|序列号|速率|电流|固件|协议|重置|复位|刷新|重新加载|重新识别|重新初始化|失灵|卡死|没反应|识别不了|连不上))(?:查看|查|看|显示|列出|检查).{0,4}(?:USB|usb|U盘|外接|外设).{0,4}(?:设备|列表|接口|总线|端口)?"
          - "(?:u盘|U盘|usb|USB).{0,4}(?:上|里).{0,4}(?:接|插|挂).{0,4}(?:啥|什么|哪些).{0,2}(?:外设|设备)"
          - "(?:usb|USB|u盘|U盘).{0,4}(?:上都|上|里).{0,4}(?:插|接|挂).{0,4}(?:了)?(?:什么|哪些|啥)"
          - "(?:USB|usb)\\s?\\d(?:\\.\\d)?.{0,4}(?:接口|端口|口)?.{0,6}(?:有|插|接|连).{0,6}(?:设备|东西|啥|什么|吗)"
          - "(?:有|现在有|一共有).{0,6}(?:几个|多少个|哪些).{0,4}(?:USB|usb|外设).{0,6}(?:设备)?"
          - "(?:USB|usb).{0,4}(?:设备|接口|外设)?.{0,4}(?:有哪些|都有啥|状态|列表)"
        # 关键词只留"列举"语义的复合词：_keyword_match 按声明序取首个命中，
        # 裸 usb/USB/外设 会让任何含 USB 的句子都只召回本工具，特化工具进不了候选集。
        keywords: ["usb设备", "USB设备", "usb接口", "USB接口",
                   "usb口", "USB口", "usb上", "USB上", "usb列表", "USB列表",
                   "u盘", "U盘", "外接设备", "lsusb",
                   "认出来了", "识别到了", "认到几个", "都认到", "认到了几"]
      local: "usb()"
    handler: "usb_list"

  sys_uptime:
