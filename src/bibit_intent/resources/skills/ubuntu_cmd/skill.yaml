        patterns:
          - "(?:查看|看|显示).{0,4}(?:网卡|网络|以太网).{0,4}(?:MAC|mac|物理)地址"
          - "MAC地址是多少"
          # 认"…的MAC / 网卡地址 / 无线网卡的MAC"，"网卡地址"默认读作物理地址。
          - "(?:查看|查|看|显示|获取).{0,4}(?:无线网卡|有线网卡|网卡|以太网).{0,4}(?:MAC|mac|物理)(?:地址)?"
