  service_status:
    display: "查看服务状态"
    display_en: "Check whether a specific service/daemon is running and its status. Use when the user asks if a service (e.g. ssh, docker) is running or its status. For listing all services use service_list; for starting/stopping use service_start/service_stop."
    short: "svc"
    aliases: ["service", "systemctl", "服务状态", "服务是否运行"]
    params:
      name: {type: str, default: ""}
    routes:
      rule:
        patterns:
          - "^(?:check|show|what(?:'s| is)?)\\s+(?:the\\s+)?(?P<name>(?!the\\b)[a-zA-Z0-9_-]{1,30})\\s+service\\s+status$"
          - "^(?:is|check\\s+if)\\s+(?:the\\s+)?(?P<name>(?!the\\b)[a-zA-Z0-9_-]{1,30})\\s+service\\s+running\\??$"
          - "(?:查看|查|看|显示).{0,4}?(?P<name>[a-zA-Z0-9_-]{1,30})(?:这个)?(?:服务|服务进程).{0,3}(?:状态|运行情况|在跑吗|是否在运行)"
          - "^(?!wifi|WiFi|WIFI|无线|网络|raid|RAID)(?P<name>[a-zA-Z0-9_-]{1,30})(?:服务)?(?:状态|是否运行|在运行吗|跑着吗)"
          - "^(?:查看|查|看)(?:一下)?服务状态"
          - "^(?!wifi|WiFi|WIFI|无线|网络|raid|RAID)(?P<name>[a-zA-Z0-9_-]{1,30})(?:服务|进程)?(?:有没有在跑|在跑吗|在运行吗|是否在运行)"
          # 口语直通：看看ssh有没有在跑（无\"服务\"二字），规则层定死，绕开 1B 选 net_conn。
          - "(?:看看|查看|查|看|检查).{0,4}?(?P<name>[a-zA-Z0-9_-]{1,30})(?:这个)?(?:服务|进程)?(?:有没有在跑|在跑吗|在运行吗|是否在运行|跑没跑|起来了没|在不在)"
        keywords: ["服务状态", "服务在跑吗", "服务是否运行", "运行中的服务", "服务列表", "有没有在跑", "systemctl"]
      local: "svc(name:...)"
    handler: "service_status"

