    routes:
      rule:
        patterns:
          - "^(?:show|list|display)\\s+(?:the\\s+)?routing\\s+table$"
          - "(?:查看|看|显示).{0,4}(?:路由|路由表|网关)"
          - "路由信息"
        keywords: ["路由表", "路由信息", "网关", "netstat -rn", "ip route"]
      local: "route()"
    handler: "net_route"
    mcp:
      group: readonly

  net_mac:
    display: "查看网卡 MAC 地址"
    display_en: "Show the network interface MAC (physical) address. Use when the user asks about the MAC or physical address, not the IP."
