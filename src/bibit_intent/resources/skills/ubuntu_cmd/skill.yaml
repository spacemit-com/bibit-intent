          - "^(?:please\\s+)?(?:traceroute|tracepath|trace)\\s+(?:the\\s+)?(?:route|path)?\\s*(?:to|for)?\\s*(?P<host>[a-zA-Z0-9.-]{1,60})$"
        keywords: ["路由跟踪", "traceroute", "tracepath", "路由路径"]
      local: "trace(host:...)"
    handler: "net_trace"
    mcp:
      group: readonly

