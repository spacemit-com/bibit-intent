          - "^(?:查看|查|看|显示|检查).{0,4}(?:系统更新|系统升级|更新|升级).{0,4}(?:状态|进度|结果|完成了吗|好了吗)$"
          - "^(?:what(?:'s| is)|check)\\s+the\\s+(?:system\\s+)?update\\s+(?:status|progress|result)\\??$"
        keywords: ["系统更新状态", "系统更新进度", "升级状态", "更新结果", "系统更新好了吗"]
      local: null
    confirm: false
    handler: "system_update_status"
