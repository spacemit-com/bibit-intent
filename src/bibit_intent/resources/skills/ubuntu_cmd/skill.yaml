    display: "查询系统更新状态"
    display_en: "Check the latest system update task status. Use when the user asks whether a system update is running, finished, failed, or what its progress is."
    short: "updatestatus"
    aliases: ["系统更新状态", "系统更新进度", "升级状态", "更新结果"]
    params: {}
    routes:
      rule:
