        # 补"网卡的mac/无线网卡mac/网卡地址"（net_ip 不再收"网卡地址"）。
        keywords: ["mac地址", "物理地址", "硬件地址", "网卡mac", "网卡物理地址", "网卡硬件地址", "网卡的mac", "无线网卡mac", "网卡地址"]
      local: "mac()"
    handler: "net_mac"
    mcp:
      group: readonly

