# Ubuntu 系统管理 Skill
# 依据 wiki.ubuntu.org.cn/UbuntuSkills 提炼的「修改类」运维命令：
#   安装/卸载/更新/清理软件、挂载/检查/格式化磁盘、杀进程、
#   启停服务、增删用户、iptables 拦截、文件编码转换
# 安全：全部走执行层二次确认（system.confirm: true，见 skill_loader 透传），
#       交互式 CLI 会弹 [y/N]，非交互（管道/EOF）默认拒绝。

name: ubuntu_admin
version: "1.0"
display: "Ubuntu 系统管理"
description: "安装卸载软件/挂载磁盘/杀进程/启停服务/用户管理（需二次确认）"
author: "bibit"

requires:
  - apt-get
  - systemctl
  - iptables
  - convmv

tools:

  # ── 软件安装升级（wiki 安装升级 节）────────────────────────────────
  pkg_install:
    display: "安装软件（仅 apt/deb 系统包）"
    display_en: "Install one or more system packages (apt/deb only) in a single call. Combine every requested apt package into one call; do not emit parallel pkg_install calls. Only for OS software packages. Not for network routes, domain lookups, IP addresses, or firewall rules."
    short: "pkginstall"
    aliases: ["install", "安装软件", "装个软件", "装一下"]
    params:
      pkg: {type: str}
      allow_downgrade: {type: bool, required: false}
    routes:
      rule:
        patterns:
          - "^(?:please\\s+)?install\\s+(?P<pkg>[a-zA-Z0-9][a-zA-Z0-9+_.:=~-]*)$"
          - "(?:安装|装|下载安装).{0,4}?(?:软件|程序|包)?(?P<pkg>[a-zA-Z0-9_+.:=~-]{1,80})(?:这个软件|软件)?"
          - "(?:帮我)?装(?:个|一下|一个)(?P<pkg>[a-zA-Z0-9_+.:=~-]{1,80})"
        keywords: ["安装软件", "装个软件", "帮我装", "apt install", "装一下", "install"]
      local: "pkginstall(pkg:...)"
    confirm: true
    handler: "pkg_install"
    mcp:
      group: admin
      install_family: apt
      async: true

  pkg_remove:
    display: "卸载软件（仅 apt/deb 系统包）"
    display_en: "Remove one or more system packages (apt/deb only) in a single call. Combine every requested apt package into one call; do not emit parallel pkg_remove calls."
    short: "pkgremove"
    aliases: ["remove", "卸载软件", "删除软件"]
    params:
      pkg: {type: str}
    routes:
      rule:
        patterns:
          - "^(?:please\\s+)?(?:uninstall|remove)\\s+(?P<pkg>[a-zA-Z0-9][a-zA-Z0-9+_.-]*)$"
          - "(?:卸载|删除|移除)(?:(?!用户|账号).){0,4}?(?:软件|程序|包)?(?P<pkg>[a-zA-Z0-9_+.-]{1,40})"
          - "把?(?P<pkg>[a-zA-Z0-9_+.-]{1,40}).{0,3}(?:卸载|删掉|卸掉|移除)(?:了)?"
        keywords: ["卸载软件", "卸载", "删除软件", "apt remove", "uninstall", "remove"]
        # §4.4-C：裸词「卸载」需软件/包语境，防止「卸载防火墙」「卸载用户」误注入。
        require_object: ["软件", "程序", "包", "apt", "deb"]
      local: "pkgremove(pkg:...)"
    confirm: true
    handler: "pkg_remove"
    mcp:
      group: admin
      install_family: apt
      async: true

  # ── 生态软件安装（pip / npm / 本地安装）──────────────────────────
  # 与 pkg_install 平级拆分：PyPI/registry/本地文件不再由 apt 通吃。
  # 默认用户态安装（venv / ~/.local）规避 PEP 668；系统级操作必须
  # confirm + sudo。规则层由 intent 的 ecosystem 分支确定性路由。

  pip_install:
    display: "安装 Python 包"
    display_en: "Install Python package (PyPI)"
    short: "pipinstall"
    aliases: ["pip install", "pip 安装", "安装python库", "安装python包"]
    params:
      pkg: {type: str}
      target: {type: str, default: ""}
      allow_downgrade: {type: bool, default: false}
    routes:
      rule:
        patterns:
          - "^(?:please\\s+)?pip\\s+(?:install|安装|装)\\s+(?P<pkg>[a-zA-Z0-9_\\-\\[\\].=@]+)$"
          - "(?:安装|装|装个|装一下|下载安装)\\s*(?:python|pip)\\s*(?:库|模块|包)\\s*[:：]?\\s*(?P<pkg>[a-zA-Z0-9_\\-\\[\\].=@]+)"
          - "装(?:个|一下|一个)?\\s*(?:库|模块)\\s*[:：]?\\s*(?P<pkg>[a-zA-Z0-9_\\-\\[\\].=@]+)"
        keywords: ["pip install", "pip 安装", "python 库", "python 包"]
      local: null
    confirm: false
    handler: "pip_install"
    mcp:
      group: admin
      install_family: pip
      async: true

  pip_uninstall:
    display: "卸载 Python 包"
    display_en: "Uninstall Python package (PyPI)"
    short: "pipuninstall"
    aliases: ["pip uninstall", "卸载python库", "卸载python包"]
    params:
      pkg: {type: str}
      target: {type: str, default: ""}
    routes:
      rule:
        patterns:
          - "^(?:please\\s+)?pip\\s+(?:uninstall|卸载|卸)\\s+(?P<pkg>[a-zA-Z0-9_\\-\\[\\].=@]+)$"
          - "(?:卸载|移除|卸掉)\\s*(?:python|pip)\\s*(?:库|模块|包)\\s*[:：]?\\s*(?P<pkg>[a-zA-Z0-9_\\-\\[\\].=@]+)"
        keywords: ["pip uninstall"]
      local: null
    confirm: true
    handler: "pip_uninstall"
    mcp:
      group: admin
      install_family: pip
      async: true

  npm_install:
    display: "安装 Node 包"
    display_en: "Install Node.js package (npm registry)"
    short: "npminstall"
    aliases: ["npm install", "npm 安装", "安装node包", "安装npm包"]
    params:
      pkg: {type: str}
      global_install: {type: bool, default: false}
      target: {type: str, default: ""}
      allow_downgrade: {type: bool, default: false}
    routes:
      rule:
        patterns:
          - "^(?:please\\s+)?npm\\s+(?:install|i|安装|装)\\s+(?P<pkg>[a-zA-Z0-9_\\-@/]+)$"
          - "(?:安装|装|装个|装一下|下载安装)\\s*(?:npm|node|nodejs|前端)\\s*(?:包|依赖)\\s*[:：]?\\s*(?P<pkg>[a-zA-Z0-9_\\-@/]+)"
          - "装(?:个|一下|一个)?\\s*(?:依赖)\\s*[:：]?\\s*(?P<pkg>[a-zA-Z0-9_\\-@/]+)"
        keywords: ["npm install", "npm 包", "node 包", "前端包"]
      local: null
    confirm: false
    handler: "npm_install"
    mcp:
      group: admin
      install_family: npm
      async: true

  npm_uninstall:
    display: "卸载 Node 包"
    display_en: "Uninstall Node.js package (npm registry)"
    short: "npmuninstall"
    aliases: ["npm uninstall", "npm remove", "卸载node包", "卸载npm包"]
    params:
      pkg: {type: str}
      global_install: {type: bool, default: false}
      target: {type: str, default: ""}
    routes:
      rule:
        patterns:
          - "^(?:please\\s+)?npm\\s+(?:uninstall|remove|卸载|卸)\\s+(?P<pkg>[a-zA-Z0-9_\\-@/]+)$"
          - "(?:卸载|移除|卸掉)\\s*(?:npm|node|nodejs|前端)\\s*(?:包|依赖)\\s*[:：]?\\s*(?P<pkg>[a-zA-Z0-9_\\-@/]+)"
        keywords: ["npm uninstall", "npm remove"]
      local: null
    confirm: true
    handler: "npm_uninstall"
    mcp:
      group: admin
      install_family: npm
      async: true

  install_local:
    display: "本地安装软件包"
    display_en: "Install local package file (.deb via apt/dpkg, .whl/.tgz)"
    short: "installlocal"
    aliases: ["install local", "本地安装", "安装本地包"]
    params:
      path: {type: str, default: ""}
      dir: {type: str, default: ""}
      deps: {type: bool, default: true}
      target: {type: str, default: ""}
      allow_downgrade: {type: bool, default: false}
    routes:
      rule:
        patterns:
          - "(?:在\\s*(?P<dir>[^，,。;；\\s]+?)\\s*(?:目录|文件夹|路径)?\\s*(?:里|中|下)?\\s*)?(?:安装|装|下载安装)\\s*(?:本地)?\\s*(?:软件|文件|包)?\\s*(?P<path>[\\w+./~-]+\\.(?:deb|whl|tgz|tar\\.gz))"
          - "(?:(?:把|将)\\s*)?(?P<path>[\\w+./~-]+\\.(?:deb|whl|tgz|tar\\.gz))\\s*(?:安装|装)\\s*(?:到|至)\\s*(?P<dir>[^，,。;；\\s]+)"
          - "(?:安装|装|下载安装)\\s*(?:本地)?\\s*(?:软件|文件|包)?\\s*(?P<path>[\\w+./~-]+\\.(?:deb|whl|tgz|tar\\.gz))\\s*(?:到|至)\\s*(?P<dir>[^，,。;；\\s]+)"
          - "(?:安装|装|下载安装)\\s*(?:本地)?\\s*(?:软件|文件|包)?\\s*(?P<path>[\\w+./~-]+\\.(?:deb|whl|tgz|tar\\.gz))"
          - "^(?:install(?: local)?)\\s+(?P<path>[\\w+./~-]+\\.(?:deb|whl|tgz|tar\\.gz))$"
        keywords: ["本地安装", "安装本地包"]
      local: null
    confirm: true
    handler: "install_local"
    mcp:
      group: admin
      async: true

  dep_apply:
    display: "按依赖计划安装（需确认）"
    display_en: "Install dependencies from a confirmed dependency plan (requires approval)"
    short: "depapply"
    aliases: ["安装依赖", "按计划安装", "安装项目依赖"]
    params:
      plan_id: {type: str}
      items: {type: str, default: ""}
    routes:
      rule:
        patterns:
          - "^(?:按计划)?安装依赖\\s+(?P<plan_id>dep-[0-9a-f]+)(?:\\s+(?P<items>[0-9,，\\s]+))?$"
          - "^install\\s+dependencies\\s+(?P<plan_id>dep-[0-9a-f]+)(?:\\s+(?P<items>[0-9,\\s]+))?$"
        # 不要用 "install dependencies"：它会被 pkg_install 的
        # ^install\s+(?P<pkg>...)$ 规则以置信度 1.0 吃掉（test_skill_routes 守护）
        keywords: ["安装依赖", "按计划安装", "install project dependencies"]
      local: null
    confirm: true
    handler: "dep_apply"
    mcp:
      group: admin
      async: true

  pkg_update:
    display: "系统更新"
    display_en: "Update non-agent system packages; agent stack upgrades in a separate background service"
    short: "pkgupdate"
    aliases: ["update", "系统更新", "升级系统", "升级软件"]
    params:
      confirm: {type: bool, required: false}
    routes:
      rule:
        patterns:
          - "^(?:update|upgrade)\\s+(?:the\\s+)?(?:package\\s+lists?|system|all\\s+packages)$"
          - "^(?:(?:请|麻烦)(?:你)?\\s*)?(?:帮我\\s*)?(?:更新|升级)(?:一下)?\\s*(?:系统|系统软件|软件|软件包|所有软件包|所有软件|已安装的软件)(?:列表|到最新)?(?:一下|吧)?[。！!]?$"
          - "^(?:系统|系统软件)(?:更新|升级)(?:一下)?[。！!]?$"
          - "^把(?:系统|软件|软件包)(?:都)?(?:更新|升级)(?:一下|了)?[。！!]?$"
          - "^apt(?:-get)?\\s+(?:update|upgrade)(?:一下)?[。！!]?$"
        keywords: ["系统更新", "升级系统", "更新软件", "apt upgrade", "apt update"]
      local: "pkgupdate()"
    confirm: true
    handler: "pkg_update"
    mcp:
      group: admin
      async: false

  pkg_clean:
    display: "清理软件缓存"
    display_en: "Clean apt package cache (apt-get clean)"
    short: "pkgclean"
    aliases: ["clean", "清理缓存", "清缓存"]
    params: {}
    routes:
      rule:
        patterns:
          - "^(?:clean|clear)\\s+(?:the\\s+)?(?:apt|package)\\s+cache$"
          - "^(?:(?:请|麻烦)(?:你)?\\s*)?(?:帮我\\s*)?(?:清理|清除|清掉)(?:一下)?\\s*(?:所有)?(?:软件包|软件|安装包|包|apt)\\s*(?:缓存|旧版本缓存)(?:一下|吧)?[。！!]?$"
          - "^apt(?:-get)?\\s+clean$"
        keywords: ["清理缓存", "清缓存", "apt clean", "apt autoclean"]
      local: "pkgclean()"
    confirm: true
    handler: "pkg_clean"

  pkg_autoremove:
    display: "删除孤立软件"
    display_en: "Remove orphaned/unused packages (apt-get autoremove)"
    short: "pkgautoremove"
    aliases: ["autoremove", "清理孤立软件", "无用的包"]
    params: {}
    routes:
      rule:
        patterns:
          - "^(?:remove|clean)\\s+(?:unused|unneeded|orphaned)\\s+packages$"
          - "(?:删除|清理|移除).{0,4}(?:孤立|不再使用|无用).{0,4}(?:软件|包|依赖)"
        keywords: ["孤立软件", "不再使用的包", "无用依赖", "apt autoremove"]
      local: "pkgautoremove()"
    confirm: true
    handler: "pkg_autoremove"
    mcp:
      group: admin
      async: true

  pkg_restore_selections:
    display: "从备份恢复包列表"
    display_en: "Restore installed package list from backup (dpkg --set-selections)"
    short: "pkgrestore"
    aliases: ["restore", "恢复包列表", "恢复软件"]
    params:
      file: {type: str}
    routes:
      rule:
        patterns:
          - "(?:恢复|还原).{0,4}(?:软件|包|软件包)(?:列表|清单).{0,4}?(?P<file>[a-zA-Z0-9_/.-]{1,80})?"
        keywords: ["恢复包列表", "还原软件列表", "dpkg --set-selections"]
      local: "pkgrestore(file:...)"
    confirm: true
    handler: "pkg_restore_selections"
    mcp:
      group: admin
      async: true

  # ── 硬盘管理（wiki 硬盘 节）────────────────────────────────────────
  disk_mount:
    display: "挂载分区"
    display_en: "Mount a partition/device to a mount point. Use when the user asks to mount a partition or USB drive. For unmounting use disk_umount. Requires confirmation."
    short: "mount"
    aliases: ["mount", "挂载", "挂载分区"]
    params:
      dev: {type: str}
      path: {type: str}
    routes:
      rule:
        patterns:
          - "(?:挂载|mount).{0,4}?(?P<dev>/dev/[a-zA-Z0-9]+).{0,4}(?:到|至).{0,4}?(?P<path>/[a-zA-Z0-9_/.-]*)"
          - "^(?:please\\s+)?mount\\s+(?P<dev>/dev/[a-zA-Z0-9]+)\\s+(?:on|to|at)\\s+(?P<path>/[a-zA-Z0-9_/.-]*)$"
        keywords: ["挂载", "挂载分区", "mount", "挂载U盘"]
        # §4.4-C：裸词「挂载」需存储设备语境，防止「挂载点」「挂载目录」误注入。
        require_object: ["分区", "U盘", "u盘", "磁盘", "硬盘", "设备", "mount", "/dev"]
      local: "mount(dev:... path:...)"
    confirm: true
    handler: "disk_mount"

  disk_umount:
    display: "卸载分区"
    display_en: "Unmount a partition/device (safely eject). Use when the user asks to unmount a partition or eject a drive. For mounting use disk_mount. Requires confirmation."
    short: "umount"
    aliases: ["umount", "卸载磁盘", "弹出磁盘"]
    params:
      target: {type: str}
    routes:
      rule:
        patterns:
          - "(?:卸载|umount).{0,4}?(?P<target>/dev/[a-zA-Z0-9]+|/[a-zA-Z0-9_/.-]*)"
          - "^(?:please\\s+)?(?:unmount|umount)\\s+(?P<target>/[a-zA-Z0-9_/.-]+)$"
        keywords: ["卸载分区", "卸载磁盘", "umount", "安全弹出"]
      local: "umount(target:...)"
    confirm: true
    handler: "disk_umount"

  disk_check:
    display: "硬盘检查"
    display_en: "Check a disk/partition for errors (fsck). Use when the user asks to check a disk or partition for errors. Requires confirmation."
    short: "fsck"
    aliases: ["fsck", "检查磁盘", "磁盘自检"]
    params:
      dev: {type: str, default: "/dev/sda1"}
    routes:
      rule:
        # 强制要求磁盘/分区语境，避免"检查WiFi网络""检查无线网"等被误判
        patterns:
          - "(?:检查|自检|fsck).{0,4}?(?P<dev>/dev/[a-zA-Z0-9]+)?(?:磁盘|分区|硬盘).{0,4}(?:错误|坏块)?"
          - "(?:检查|自检|fsck)磁盘|磁盘自检|硬盘检查"
        keywords: ["检查磁盘", "磁盘自检", "fsck", "检查分区"]
      local: "fsck(dev:...)"
    confirm: true
    handler: "disk_check"

  disk_format:
    display: "格式化分区"
    display_en: "Format a partition (destroys all data on it). Use when the user explicitly asks to format a partition. Destructive: requires confirmation."
    short: "mkfs"
    aliases: ["mkfs", "格式化", "格式化分区"]
    params:
      dev: {type: str}
    routes:
      rule:
        patterns:
          - "(?:格式化|mkfs).{0,4}?(?P<dev>/dev/[a-zA-Z0-9]+)(?:分区)?"
        keywords: ["格式化", "格式化分区", "mkfs", "抹掉分区"]
      local: "mkfs(dev:...)"
    confirm: true
    handler: "disk_format"

  # ── 进程管理（wiki 进程 节）────────────────────────────────────────
  proc_kill:
    display: "中止进程"
    display_en: "Kill/terminate a process by PID. Use when the user asks to kill or end a process. For listing processes use proc_list. Requires confirmation."
    short: "kill"
    aliases: ["kill", "杀进程", "结束进程", "终止进程"]
    params:
      pid: {type: int}
    routes:
      rule:
        patterns:
          - "(?:杀掉|结束|终止|杀死|kill).{0,4}?(?P<pid>\\d+)(?:号)?(?:进程)?"
        keywords: ["杀进程", "结束进程", "终止进程", "kill"]
      local: "kill(pid:数字)"
    confirm: true
    handler: "proc_kill"

  proc_zombie:
    display: "清除僵尸进程"
    display_en: "Clean up zombie processes. Use when the user asks to clear or kill zombie processes. Requires confirmation."
    short: "zombie"
    aliases: ["zombie", "僵尸进程", "清理僵尸"]
    params: {}
    routes:
      rule:
        patterns:
          - "(?:清理|清除|杀掉).{0,4}(?:僵尸|zombie)(?:进程)?"
        keywords: ["僵尸进程", "清理僵尸", "zombie"]
      local: "zombie()"
    confirm: true
    handler: "proc_zombie"

  # ── 服务管理（wiki 服务 节）────────────────────────────────────────
  service_restart:
    display: "重启服务"
    display_en: "Restart a service. Use when the user asks to restart a specific service (e.g. ssh, docker). For checking status use service_status; for starting use service_start; for stopping use service_stop. Requires confirmation."
    short: "svcrestart"
    aliases: ["restart", "重启服务", "服务重启"]
    params:
      name: {type: str}
    routes:
      rule:
        # 强制"服务"后缀：只有"重启XX服务"才走 systemctl
        patterns:
          - "^(?:please\\s+)?restart\\s+(?:the\\s+)?(?P<name>[a-zA-Z0-9_-]{1,30})\\s+service$"
          - "(?:重启|重新启动)\\s*(?P<name>[a-zA-Z0-9_-]{1,30})\\s*服务"
          - "把?\\s*(?P<name>[a-zA-Z0-9_-]{1,30})\\s*服务\\s*(?:重启一下|重新启动一下)"
        keywords: ["重启服务", "服务重启", "restart服务"]
      local: "svcrestart(name:...)"
    confirm: true
    handler: "service_restart"

  service_stop:
    display: "停止服务"
    display_en: "Stop a service. Use when the user asks to stop or shut down a specific service. For checking status use service_status; for starting use service_start. Requires confirmation."
    short: "svcstop"
    aliases: ["stop", "停止服务", "关服务"]
    params:
      name: {type: str}
    routes:
      rule:
        # 强制要求"服务"后缀：避免"关闭WiFi""关闭浏览器"等被误判为服务操作。
        # 只有明确说"XX服务"才走 systemctl，否则交给硬件/应用 skill。
        patterns:
          - "^(?:please\\s+)?(?:stop|shut down)\\s+(?:the\\s+)?(?P<name>[a-zA-Z0-9_-]{1,30})\\s+service$"
          - "(?:停止|停掉|关闭)\\s*(?P<name>[a-zA-Z0-9_-]{1,30})\\s*服务"
          - "把?\\s*(?P<name>[a-zA-Z0-9_-]{1,30})\\s*服务\\s*(?:停掉|停一下|关掉|停下来)"
        keywords: ["停止服务", "关服务", "停服务"]
      local: "svcstop(name:...)"
    confirm: true
    handler: "service_stop"

  service_start:
    display: "启动服务"
    display_en: "Start a service. Use when the user asks to start or enable a specific service. For checking status use service_status; for stopping use service_stop. Requires confirmation."
    short: "svcstart"
    aliases: ["start", "启动服务", "开服务"]
    params:
      name: {type: str}
    routes:
      rule:
        # 强制"服务"后缀：只有"启动XX服务"才走 systemctl
        patterns:
          - "^(?:please\\s+)?(?:start|enable)\\s+(?:the\\s+)?(?P<name>[a-zA-Z0-9_-]{1,30})\\s+service$"
