  # ── 文件编码转换（wiki 中文 节）────────────────────────────────────
  text_convert:
    display: "转换文件编码"
    display_en: "Convert a file's text encoding (e.g. GBK to UTF-8). Use when the user asks to convert a file's encoding or charset. For detecting encoding use text_encoding. Requires confirmation."
    short: "conv"
    aliases: ["convmv", "转码", "编码转换", "gbk转utf8"]
    params:
      path: {type: str}
    routes:
      rule:
        patterns:
          - "(?:转换|转码).{0,4}?(?P<path>[a-zA-Z0-9_/.-]{1,80})?.{0,4}(?:编码)?(?:GBK|gbk|UTF-8|utf8)"
          - "(?P<path>[a-zA-Z0-9_/.-]{1,80}).{0,3}(?:转码|编码转换)"
          - '(?:把|将)?\s*(?P<path>[a-zA-Z0-9_/.-]{1,80})\s*(?:这个)?(?:文件)?\s*(?:转成|转为|转换成|转换为)\s*(?:utf8|UTF-8|gbk|GBK|编码)'
        keywords: ["转码", "编码转换", "gbk转utf8", "convmv", "转成", "编码", "utf8"]
        # §4.4-C：裸词「转码/编码/转成」需文件/字符/编码语境，防止「转码视频」「编码格式」「转成PDF」误注入。
        require_object: ["文件", "字符", "GBK", "gbk", "UTF", "utf", "convmv", "编码转换"]
      local: "conv(path:...)"
    confirm: true
    handler: "text_convert"
